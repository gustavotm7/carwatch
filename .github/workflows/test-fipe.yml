name: FIPE probe
on:
  push:
    branches: [carwatch-test]
    paths: ["tests/fipe_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tests/fipe_probe.py
      - run: |
          git config user.name "carwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add tests/fipe_probe.json && git commit -qm "FIPE probe results" && git pull -q --rebase && git push -q
