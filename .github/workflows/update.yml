name: update
# Daily: check every listed ad, look for new ones, rebuild the web app's data, publish the site.
on:
  schedule:
    - cron: "17 9 * * *"          # about 4:17 am Toronto in winter, 5:17 am in summer
  workflow_dispatch:               # "Run workflow" button = update now
  push:
    branches: [carwatch-test]
    paths: ["collector/**", "cars_config.json", "cars_config_br.json", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Decide what to run, then start from the latest saved data
        run: |
          ARGS=""
          # a push that only changes the web page (or this workflow) rebuilds the data without visiting the sites
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only HEAD~1 HEAD | grep -qE '^(collector/|cars_config)'; then ARGS="--no-network"; fi
          # a commit marked [site-only] (links, wording) never visits the sites either
          if [ "${{ github.event_name }}" = "push" ] && git log -1 --format=%B | grep -qF '[site-only]'; then ARGS="--no-network"; fi
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
          # a run that waited behind another one must not rebuild from older data than the branch now has
          git fetch -q --depth=1 origin "${GITHUB_REF_NAME}" && git reset -q --hard FETCH_HEAD
          git log --oneline -1
      - name: Collect
        run: |
          python -u collector/car_collector.py --config cars_config.json --data-dir data \
            --export-json site/data/cars.json --no-xlsx --no-photos --keep-snapshots 14 \
            --max-new 250 --skip-sources carpages $ARGS
      - name: Collect Brazil
        continue-on-error: true          # a problem with the Brazilian sites never stops the Canadian update
        run: |
          python -u collector/car_collector.py --config cars_config_br.json --data-dir data_br \
            --export-json site/data/cars_br.json --no-xlsx --no-photos --keep-snapshots 14 \
            --max-new 400 --no-comps $ARGS
      - name: Save data
        run: |
          git config user.name "carwatch-bot"
          git config user.email "carwatch-bot@users.noreply.github.com"
          git add -A data data_br site/data
          git commit -qm "Data update $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
