name: update
# Daily: check every listed ad, look for new ones, rebuild the web app's data, publish the site.
on:
  schedule:
    - cron: "17 9 * * *"          # about 4:17 am Toronto in winter, 5:17 am in summer
  workflow_dispatch:               # "Run workflow" button = update now
  push:
    branches: [carwatch-test]
    paths: ["collector/**", "cars_config.json", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Collect
        run: |
          ARGS=""
          # a push that only changes the web page rebuilds the data without visiting the sites
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only HEAD~1 HEAD | grep -qE '^(collector/|cars_config.json|.github/)'; then ARGS="--no-network"; fi
          python -u collector/car_collector.py --config cars_config.json --data-dir data \
            --export-json site/data/cars.json --no-xlsx --no-photos --keep-snapshots 14 $ARGS
      - name: Save data
        run: |
          git config user.name "carwatch-bot"
          git config user.email "carwatch-bot@users.noreply.github.com"
          git add -A data site/data
          git commit -qm "Data update $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
