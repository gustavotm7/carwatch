name: test-br
on:
  push:
    branches: [carwatch-test]
    paths: ["tests/br_test.py"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python tests/br_test.py
      - run: |
          git config user.name "carwatch-bot"; git config user.email "carwatch-bot@users.noreply.github.com"
          git add tests/br_results.json && git commit -qm "Brazil site test results" && git pull -q --rebase && git push -q
