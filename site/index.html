<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>CarWatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1318; --surface:#171c23; --raised:#1e242d; --line:#29313c;
  --text:#eef1f4; --muted:#8d97a5; --dim:#5f6876;
  --good:#3ccf8e; --warn:#f0b23e; --bad:#f2675c;
  --radius:14px;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--sans);
  padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #9fb4ff;outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(15,19,24,.92);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-inner{max-width:1100px;margin:0 auto;padding:10px 14px 0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font:700 24px/1 var(--cond);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.flag-btn{display:flex;align-items:center;padding:6px 4px;margin:-6px -4px;border-radius:5px;line-height:0;
  background:none;border:0;box-shadow:none;cursor:pointer}
.flag-btn:hover .cflag{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.flag-btn:active .cflag{transform:scale(.94)}
.cflag{height:.72em;width:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.12);display:block;transition:transform .12s}
.others{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.others b{color:var(--text);font-weight:600}
.others button{margin-left:auto;padding:8px 14px;border-radius:999px;background:var(--raised);color:var(--text);font-weight:600;white-space:nowrap}
.linkset{display:grid;gap:14px;margin-top:6px}
.linkset h3{margin:0 0 6px!important}
.linkset .btns{display:flex;gap:8px;flex-wrap:wrap}
.linkset a{padding:9px 14px;border-radius:999px;background:var(--raised);color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
.linkset a:hover{background:#252c36}
.brand .meta{color:var(--muted);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--raised);color:var(--text)}

.controls{display:flex;gap:8px;align-items:center;margin-top:10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 16px;border-radius:999px;font:600 15px/1 var(--cond);color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.dir{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;
  color:var(--text);font-size:13px;background:var(--surface)}
.dir svg{transition:transform .2s}
.dir[data-dir=asc] svg{transform:rotate(180deg)}
.filters-btn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13px}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--text);color:var(--bg);font:600 11px/18px var(--sans);
  text-align:center;padding:0 5px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 12px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 15px/1 var(--cond);letter-spacing:.02em}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,#888)}
.gmode{flex:none;display:flex;position:sticky;left:0;z-index:2;padding:3px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);box-shadow:-14px 0 0 #10141a,10px 0 12px -6px #10141a}
.gmode button{padding:6px 12px;border-radius:999px;font:600 15px/1 var(--cond);letter-spacing:.02em;color:var(--muted)}
.gmode button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.gmode button.auto[aria-pressed=true]{background:#f0b23e;color:#1d1505}
.top.auto-on{border-bottom:2px solid #f0b23e}
.auto-note{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;font-size:14px;
  background:rgba(240,178,62,.12);border:1px solid rgba(240,178,62,.45);color:#ffd27e}
.auto-note b{color:#ffe2a6}
.auto-note button{margin-left:auto;padding:8px 14px;border-radius:999px;background:#f0b23e;color:#1d1505;font-weight:600;white-space:nowrap}
.fact.gb-a{background:rgba(240,178,62,.10);color:#ffd27e;border-color:rgba(240,178,62,.3)}
.confirm{display:grid;gap:10px;margin-top:20px}
.confirm button{padding:14px;border-radius:12px;font:600 16px/1 var(--sans);background:var(--raised);color:var(--text)}
.confirm .primary{background:var(--text);color:var(--bg)}
#more{grid-column:1/-1;height:1px}
.chip .n{font:500 12px/1 var(--sans);color:var(--dim)}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--c,#cfd6df);background:color-mix(in srgb,var(--c,#cfd6df) 18%,var(--surface))}
.chip[aria-pressed=true] .n{color:var(--muted)}

/* ---------- list ---------- */
main{max-width:1100px;margin:0 auto;padding:12px 10px 40px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){main{grid-template-columns:1fr 1fr;padding:16px 14px 48px}}
@media(min-width:1080px){main{grid-template-columns:1fr 1fr 1fr}}
.count{grid-column:1/-1;color:var(--muted);font-size:13px;padding:0 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column}
.card:hover{border-color:#3a4452}
.photo{position:relative;aspect-ratio:16/10;background:#0b0e12}
.photo img.pic{width:100%;height:100%;object-fit:cover;display:block}
.photo .nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px}
.photo .nophoto[hidden]{display:none}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;
  background:linear-gradient(to top,rgba(10,13,17,.78),rgba(10,13,17,0));pointer-events:none}
.name{position:absolute;left:10px;top:10px;z-index:2;background:var(--c);color:#fff;border-radius:8px;
  padding:5px 10px 4px;font:700 20px/1 var(--cond);letter-spacing:.02em;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.gauge{position:absolute;right:8px;top:8px;z-index:2;width:66px;height:66px;border-radius:50%;
  background:rgba(12,15,20,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.gauge svg{position:absolute;inset:0}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font:700 25px/1 var(--cond);padding-bottom:2px}
.gauge small{position:absolute;left:0;right:0;bottom:7px;text-align:center;font:500 10px/1 var(--sans);color:var(--muted)}
.src{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:6px;
  background:rgba(12,15,20,.78);border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;color:#d8dde4}
.src img{width:16px;height:16px;border-radius:4px;background:#fff}
.tags{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;gap:6px}
.tag{border-radius:999px;padding:3px 9px;font:600 12px/1.4 var(--sans)}
.tag.new{background:#e9eef5;color:#10151c}
.tag.drop{background:rgba(60,207,142,.18);color:#7ff0bb;border:1px solid rgba(60,207,142,.4)}
.tag.rise{background:rgba(242,103,92,.18);color:#ffb0a8;border:1px solid rgba(242,103,92,.4)}
.tag.age{background:rgba(12,15,20,.78);color:#d8dde4;font-weight:500}
.tag.age.long{color:#ffd27e;box-shadow:inset 0 0 0 1px rgba(240,178,62,.45)}

.body{padding:11px 14px 13px;display:flex;flex-direction:column;gap:9px}
.row1{display:flex;align-items:center;gap:10px}
.price{font:700 28px/1 var(--cond);letter-spacing:.01em}
.deal{font-size:13px;font-weight:600;color:var(--muted);border-radius:7px;padding:4px 8px;border:1px solid var(--line)}
.deal.under{color:#8ef0c0;background:rgba(60,207,142,.12);border-color:rgba(60,207,142,.3)}
.deal.over{color:#ffaaa2;background:rgba(242,103,92,.12);border-color:rgba(242,103,92,.32)}
.info{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--muted);flex:none}
.info:hover{color:var(--text);border-color:#4a5563}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:4px 8px;font:500 13px/1.25 var(--sans);
  background:var(--raised);color:#d3d9e1;border:1px solid transparent}
.fact.year{font:700 15px/1.1 var(--cond);letter-spacing:.03em}
.fact.km{position:relative;overflow:hidden;padding-bottom:6px}
.fact.km i{position:absolute;left:0;bottom:0;height:3px;background:#e0a34a;border-radius:0 2px 2px 0}
.fact.gb-m{background:rgba(60,207,142,.13);color:#8ef0c0;border-color:rgba(60,207,142,.3)}
.fact.gb-c{background:rgba(240,178,62,.14);color:#ffd27e;border-color:rgba(240,178,62,.35)}
.fact.gb-u{background:var(--raised);color:var(--muted);border-color:var(--line)}
.fact.body-coupe{box-shadow:inset 3px 0 0 #8b84e8}
.fact.body-conv{box-shadow:inset 3px 0 0 #e0a34a}
.fact.body-sedan{box-shadow:inset 3px 0 0 #8fa3b8}
.fact.body-wagon{box-shadow:inset 3px 0 0 #b9875a}
.fact.trim{background:none;border-color:var(--line);color:var(--text)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{border-radius:7px;padding:4px 8px;font:600 13px/1.25 var(--sans);background:rgba(242,103,92,.14);color:#ffaaa2;
  border:1px solid rgba(242,103,92,.35)}
.flag.hard{background:#d9483d;color:#fff;border-color:#d9483d}
.place{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px}
.empty button{margin-top:12px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);color:var(--text)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:40;opacity:0;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--surface);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){.sheet{left:50%;right:auto;width:560px;bottom:auto;top:50%;border-radius:18px;border:1px solid var(--line);
  transform:translate(-50%,-46%);opacity:0;transition:opacity .18s,transform .18s}}
.open .scrim{opacity:1}
.open .sheet{transform:translateY(0)}
@media(min-width:760px){.open .sheet{transform:translate(-50%,-50%);opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
@media(min-width:760px){.grab{display:none}}
.sheet h2{font:700 26px/1.05 var(--cond);margin:4px 0 2px;display:flex;align-items:center;gap:10px}
.sheet h2 .pill{background:var(--c);color:#fff;border-radius:7px;padding:4px 9px 3px;font-size:20px}
.sheet .sub{color:var(--muted);margin:0 0 6px}
.sheet h3{font:600 17px/1.2 var(--cond);letter-spacing:.02em;color:var(--muted);margin:18px 0 8px}
.sheet p{margin:0 0 8px;max-width:68ch}
.desc{color:#cfd5dd;font-size:14px;max-height:9.5em;overflow:auto;border-left:2px solid var(--line);padding-left:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.good-list{display:flex;flex-wrap:wrap;gap:6px}
.plus{border-radius:7px;padding:4px 8px;font:600 13px/1.25 var(--sans);background:rgba(60,207,142,.12);color:#8ef0c0;
  border:1px solid rgba(60,207,142,.3)}
.none{color:var(--dim);font-size:14px}
.primary{display:block;width:100%;margin-top:20px;padding:13px;border-radius:12px;background:var(--text);color:var(--bg);
  font:700 18px/1 var(--cond);letter-spacing:.03em;text-align:center;text-decoration:none}
.close{position:absolute;right:10px;top:10px}

.opt-group{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 13px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.opt[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:#cfd6df}
select.opt{background:var(--raised);color:var(--text);padding:8px 12px;font-size:15px}
.range output{min-width:92px;text-align:right;font:600 17px/1 var(--cond)}
.sheet-actions{display:flex;gap:10px;margin-top:22px}
.sheet-actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.sheet-actions .go{background:var(--text);color:var(--bg);border-color:var(--text)}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:16px;text-align:left}
.menu small{display:block;color:var(--muted);font-size:13px}
.gone a{color:var(--text)}
.chart{display:block;width:100%;height:auto;margin:2px 0 6px}
.chart text{font:500 11px var(--sans);fill:var(--muted)}
.chart .lab{font:700 13px var(--cond);fill:var(--text)}
.steps{list-style:none;margin:0;padding:0;font-size:14px;display:grid;gap:3px}
.steps li{display:flex;gap:10px}
.steps span:first-child{color:var(--muted);min-width:7.5em}
.dn{color:#8ef0c0} .up{color:#ffaaa2}
.est{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.est b{font:700 26px/1 var(--cond)}
.comps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.comps a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 10px;border-radius:10px;
  color:var(--text);text-decoration:none;background:var(--raised)}
.comps a:hover{background:#252c36}
.comps .t{font-size:14px;line-height:1.3}
.comps .m{grid-column:1;color:var(--muted);font-size:13px}
.comps .p{grid-row:1;grid-column:2;text-align:right;font:700 17px/1.2 var(--cond)}
.comps .a{grid-row:2;grid-column:2;text-align:right;color:var(--muted);font-size:12px}
.fine{color:var(--dim);font-size:13px;margin-top:8px!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>CarWatch<button class="flag-btn" id="flagBtn" type="button"></button></h1>
      <span class="meta" id="meta">Loading…</span>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="16" cy="10" r="1.8"/></svg>
      </button>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Sort by">
        <button id="sortScore" aria-pressed="true">Score</button>
        <button id="sortPrice" aria-pressed="false">Price</button>
      </div>
      <button class="dir" id="dirBtn" data-dir="desc" aria-label="Sort direction">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 2v10M3 8l4 4 4-4"/></svg>
        <span id="dirLabel">High first</span>
      </button>
      <button class="filters-btn" id="filtersBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>
        Filters <span class="badge" id="fCount" hidden>0</span>
      </button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Car"></div>
  </div>
</header>

<main id="list" aria-live="polite"></main>

<div id="layer" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FLAGS = {
  CA: `<svg class="cflag" viewBox="0 0 9600 4800" role="img" aria-label="Canada"><path fill="#d52b1e" d="M0 0h9600v4800H0z"/><path fill="#fff" d="M2400 0h4800v4800H2400z"/><path fill="#d52b1e" d="M4890 4430l-45-863a95 95 0 0 1 111-98l859 151-116-320a65 65 0 0 1 20-73l941-762-212-99a65 65 0 0 1-34-79l186-572-542 115a65 65 0 0 1-73-38l-105-247-423 454a65 65 0 0 1-111-57l204-1052-327 189a65 65 0 0 1-91-27l-332-652-332 652a65 65 0 0 1-91 27l-327-189 204 1052a65 65 0 0 1-111 57l-423-454-105 247a65 65 0 0 1-73 38l-542-115 186 572a65 65 0 0 1-34 79l-212 99 941 762a65 65 0 0 1 20 73l-116 320 859-151a95 95 0 0 1 111 98l-45 863z"/></svg>`,
  BR: `<svg class="cflag" viewBox="0 0 720 504" role="img" aria-label="Brazil"><path fill="#009c3b" d="M0 0h720v504H0z"/><path fill="#ffdf00" d="M61 252 360 61l299 191-299 191z"/><circle cx="360" cy="252" r="126" fill="#002776"/><clipPath id="brc"><circle cx="360" cy="252" r="126"/></clipPath><path clip-path="url(#brc)" d="M230 222c90-20 180-6 262 44" fill="none" stroke="#fff" stroke-width="20"/></svg>`,
};
const COUNTRIES = {
  CA: {name: "Canada", adj: "Canadian", file: "data/cars.json", sym: "$", locale: "en-CA", next: "BR"},
  BR: {name: "Brazil", adj: "Brazilian", file: "data/cars_br.json", sym: "R$\u00a0", locale: "pt-BR", next: "CA"},
};
let COUNTRY = (() => { try { return COUNTRIES[localStorage.getItem("cw-country")] ? localStorage.getItem("cw-country") : "CA"; } catch (e) { return "CA"; } })();
const CUR = () => COUNTRIES[COUNTRY];
let AUTO = false, MAN_DATA = null, AUTO_DATA = null;     // gearbox mode: always starts on manual, never saved
const money = n => n == null ? "" : CUR().sym + Math.round(n).toLocaleString(CUR().locale);
const kmFmt = n => n == null ? "km n/a" : (n >= 1000 ? Math.round(n / 1000) + "k km" : n + " km");
const SITES = {
  autotrader: {label: "Autotrader", domain: "autotrader.ca"},
  kijiji: {label: "Kijiji", domain: "kijiji.ca"},
  carpages: {label: "CarPages", domain: "carpages.ca"},
  napista: {label: "NaPista", domain: "napista.com.br"},
  mobiauto: {label: "Mobiauto", domain: "mobiauto.com.br"},
};
const GEARBOX = {
  m: {cls: "gb-m", label: "Manual", long: "Manual: the ad's data and the seller's text both say manual."},
  c: {cls: "gb-c", label: "Check gearbox", long: "The ad's data and the seller's text disagree (manual vs automatic/SMG). Ask the seller."},
  u: {cls: "gb-u", label: "Manual?", long: "The data says manual but the text never confirms it. These cars also came with SMG/DCT, so ask."},
  a: {cls: "gb-a", label: "Automatic", long: "Automatic gearbox (shown only with the Automatic button on)."},
};
const BODY = {coupe: "Coupe", conv: "Convertible", sedan: "Sedan", wagon: "Wagon", unk: "Body n/a"};
const HARD = ["Rebuilt title", "Salvage title"];
const DEFAULT_STATE = {sort: "score", dir: "desc", names: [], gear: ["m", "c", "u"], bodies: [], maxPrice: 0,
                       maxKm: 0, yearFrom: 0, yearTo: 0, hideHard: false, hideRed: false};
let DATA = null, state = load();

function stateKey() { return COUNTRY === "CA" ? "cw-state" : "cw-state-" + COUNTRY; }   // filters kept per country
function load() {
  try { return Object.assign({}, DEFAULT_STATE, JSON.parse(localStorage.getItem(stateKey()) || "{}")); }
  catch (e) { return Object.assign({}, DEFAULT_STATE); }
}
function save() { try { localStorage.setItem(stateKey(), JSON.stringify(state)); } catch (e) {} }

function scoreColor(s) {                       // red 0 -> amber 5 -> green 10
  const t = Math.max(0, Math.min(1, (s ?? 0) / 10));
  return `hsl(${Math.round(4 + t * 138)} 72% ${t > .4 && t < .7 ? 52 : 50}%)`;
}
function gauge(s) {                            // 270 degree tach arc
  const r = 27, c = 2 * Math.PI * r, arc = c * .75, val = arc * Math.max(0, Math.min(1, (s ?? 0) / 10));
  const col = scoreColor(s);
  return `<div class="gauge" aria-label="Score ${s ?? "n/a"} out of 10">
    <svg viewBox="0 0 66 66"><g transform="rotate(135 33 33)" fill="none" stroke-width="5" stroke-linecap="round">
      <circle cx="33" cy="33" r="${r}" stroke="#2b333e" stroke-dasharray="${arc} ${c}"/>
      <circle cx="33" cy="33" r="${r}" stroke="${col}" stroke-dasharray="${val} ${c}"/></g></svg>
    <b style="color:${col}">${s == null ? "–" : s.toFixed(1)}</b><small>score</small></div>`;
}
function nameColor(name) {
  const n = DATA.names.find(x => x.name === name);
  return n ? n.color : "#59626e";
}
function yearShade(y) {
  const ys = DATA.cars.map(c => c.year).filter(Boolean);
  const lo = Math.min(...ys), hi = Math.max(...ys), t = hi > lo ? (y - lo) / (hi - lo) : .5;
  return `background:hsl(215 12% ${20 + t * 26}%);color:${t > .55 ? "#0f1318" : "#e9edf2"}`;
}
function isNew(c) {
  if (!c.first_seen || c.first_seen <= DATA.baseline) return false;
  return (Date.now() - new Date(c.first_seen + "T12:00:00")) / 864e5 <= 3;
}
const DAY = 864e5;
const asDate = iso => new Date(String(iso).slice(0, 10) + "T12:00:00");
const fmtDate = (iso, yr = true) => asDate(iso).toLocaleDateString("en-CA", yr ? {month: "short", day: "numeric", year: "numeric"}
                                                                       : {month: "short", day: "numeric"});
const kShort = n => n >= 1000 ? CUR().sym.trim() + (n / 1000).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "k" : money(n);
function daysTag(c) {
  if (c.days == null || (c.days_src !== "site" && c.days < 1)) return "";
  const long = c.days >= 60;
  return `<span class="tag age${long ? " long" : ""}" title="${c.days_src === "site" ? "Days since the ad went up" : "Days since CarWatch first saw it"}">${c.days}${c.days_src === "site" ? "" : "+"} days</span>`;
}
function totalChange(c) {                     // first price CarWatch saw -> now
  const h = c.hist;
  if (h && h.length > 1) return {from: h[0][1], since: h[0][0], diff: c.price - h[0][1]};
  if (c.prev_price && c.prev_price !== c.price) return {from: c.prev_price, since: null, diff: c.price - c.prev_price};
  return null;
}
function ago(iso) {
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return "updated just now";
  if (h < 36) return `updated ${Math.round(h)} h ago`;
  return `updated ${Math.round(h / 24)} days ago`;
}

// ---------- filtering + sorting ----------
function effNames() { return state.names.filter(n => DATA.names.some(x => x.name === n)); }
function filtered() {
  const names = effNames();
  let cars = DATA.cars.filter(c =>
    (!names.length || names.includes(c.name)) &&
    (AUTO ? c.trans === "a" : state.gear.includes(c.trans)) &&
    (!state.bodies.length || state.bodies.includes(c.body)) &&
    (!state.maxPrice || c.price <= state.maxPrice) &&
    (!state.maxKm || (c.km ?? 0) <= state.maxKm) &&
    (!state.yearFrom || (c.year ?? 0) >= state.yearFrom) &&
    (!state.yearTo || (c.year ?? 9999) <= state.yearTo) &&
    !(state.hideHard && c.red.some(f => HARD.includes(f))) &&
    !(state.hideRed && c.red.length));
  const key = {score: c => c.score ?? -1, price: c => c.price, km: c => c.km ?? 1e9, year: c => c.year ?? 0,
               deal: c => c.vs_fair ?? -9, new: c => c.first_seen || "", days: c => c.days ?? -1,
               sold: c => c.sold?.vs ?? -9}[state.sort] || (c => c.score ?? -1);
  const sgn = state.dir === "asc" ? 1 : -1;
  return cars.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : a.price - b.price) * sgn; });
}
function activeFilterCount() {
  let n = 0;
  if (!AUTO && state.gear.length < 3) n++;
  if (state.bodies.length) n++;
  if (state.maxPrice) n++;
  if (state.maxKm) n++;
  if (state.yearFrom || state.yearTo) n++;
  if (state.hideHard || state.hideRed) n++;
  if (!["score", "price"].includes(state.sort)) n++;
  return n;
}

// ---------- rendering ----------
function card(c) {
  const col = nameColor(c.name), site = SITES[c.source] || {label: c.source, domain: ""};
  const g = GEARBOX[c.trans] || GEARBOX.u;
  const vs = c.vs_fair;
  const deal = vs == null ? "" : vs > .02 ? `<span class="deal under">${Math.round(vs * 100)}% under fair</span>`
             : vs < -.02 ? `<span class="deal over">${Math.round(-vs * 100)}% over fair</span>` : `<span class="deal">about fair</span>`;
  const tc = totalChange(c);
  const change = tc && tc.diff
      ? `<span class="tag ${tc.diff < 0 ? "drop" : "rise"}">${tc.diff < 0 ? "▼" : "▲"} ${money(Math.abs(tc.diff))}</span>` : "";
  const km = c.km ?? 0, kmW = Math.min(100, km / 250000 * 100);
  const flags = c.red.map(f => `<span class="flag${HARD.includes(f) ? " hard" : ""}">${esc(f)}</span>`).join("");
  return `<article class="card" tabindex="0" data-id="${esc(c.id)}" aria-label="${esc(c.year + " " + c.name + ", " + money(c.price))}">
    <div class="photo">
      ${c.photos.length ? `<img class="pic" src="${esc(c.photos[0])}" alt="" loading="lazy" decoding="async" data-alt="${esc(c.photos[1] || "")}">` : ""}
      <span class="nophoto"${c.photos.length ? " hidden" : ""}>No photo</span>
      <span class="name" style="--c:${col}">${esc(c.name)}</span>
      ${gauge(c.score)}
      <span class="src">${site.domain ? `<img src="https://www.google.com/s2/favicons?domain=${site.domain}&sz=64" alt="" loading="lazy">` : ""}${esc(site.label)}</span>
      <span class="tags">${isNew(c) ? '<span class="tag new">New</span>' : ""}${change}${daysTag(c)}</span>
    </div>
    <div class="body">
      <div class="row1"><span class="price">${money(c.price)}</span>${deal}
        <button class="info" data-info="${esc(c.id)}" aria-label="Details">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="7.2"/><path d="M9 8v5"/><circle cx="9" cy="5.3" r=".6" fill="currentColor"/></svg>
        </button></div>
      ${flags ? `<div class="flags">${flags}</div>` : ""}
      <div class="facts">
        <span class="fact year" style="${yearShade(c.year)}">${c.year ?? ""}</span>
        <span class="fact km">${kmFmt(c.km)}<i style="width:${kmW}%"></i></span>
        <span class="fact ${g.cls}">${g.label}</span>
        <span class="fact body-${esc(c.body)}">${BODY[c.body] || "Body n/a"}</span>
        ${c.trim ? `<span class="fact trim">${esc(c.trim)}</span>` : ""}
      </div>
      ${c.place ? `<div class="place"><svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 13s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C1.5 8.8 6 13 6 13Z"/><circle cx="6" cy="5.5" r="1.6"/></svg>${esc(c.place)}</div>` : ""}
    </div></article>`;
}
function renderChips() {
  const counts = {};
  DATA.cars.forEach(c => counts[c.name] = (counts[c.name] || 0) + 1);
  const names = effNames();
  const gm = MAN_DATA && MAN_DATA.auto_file
    ? `<div class="gmode" role="group" aria-label="Gearbox"><button data-gm="m" type="button" aria-pressed="${!AUTO}">Manual</button><button class="auto" data-gm="a" type="button" aria-pressed="${AUTO}">Automatic</button></div>` : "";
  const all = `<button class="chip" data-name="" aria-pressed="${!names.length}">All <span class="n">${DATA.cars.length}</span></button>`;
  $("#chips").innerHTML = gm + all + DATA.names.map(n =>
    `<button class="chip" style="--c:${n.color}" data-name="${esc(n.name)}" aria-pressed="${names.includes(n.name)}">
      <span class="dot"></span>${esc(n.name)} <span class="n">${counts[n.name] || 0}</span></button>`).join("");
}
function render() {
  const cars = filtered();
  $("#sortScore").setAttribute("aria-pressed", state.sort === "score");
  $("#sortPrice").setAttribute("aria-pressed", state.sort === "price");
  $("#dirBtn").dataset.dir = state.dir;
  $("#dirLabel").textContent = state.sort === "year" || state.sort === "new" ? (state.dir === "asc" ? "Oldest first" : "Newest first")
      : state.sort === "days" ? (state.dir === "asc" ? "Shortest" : "Longest")
      : (state.dir === "asc" ? "Low first" : "High first");
  const n = activeFilterCount();
  $("#fCount").hidden = !n; $("#fCount").textContent = n;
  renderChips();
  const others = (DATA.links || []).length
    ? `<div class="others"><span><b>OLX and Webmotors</b> aren't read automatically.</span><button id="othersBtn" type="button">Search them</button></div>` : "";
  const autoNote = AUTO
    ? `<div class="auto-note" role="status"><span><b>Automatic cars only.</b> ${esc(DATA.names.map(n => n.name).join(" and "))}.</span><button data-gm="m" type="button">Back to manual</button></div>` : "";
  const word = AUTO ? "automatic cars" : "cars";
  $("#list").innerHTML = autoNote + others + (cars.length
    ? `<div class="count">${cars.length === DATA.cars.length ? `${cars.length} ${word}` : `${cars.length} of ${DATA.cars.length} ${word}`}</div><div id="more"></div>`
    : `<div class="empty">No cars match these filters.<br><button id="clearAll">Clear filters</button></div>`);
  LIST = cars; SHOWN = 0;
  moreCards();
  watchMore();
  save();
}

let LIST = [], SHOWN = 0;
const BATCH = 40;                              // cards added per batch as you scroll (light on a phone)
function moreCards() {
  const m = $("#more");
  if (!m || SHOWN >= LIST.length) return;
  m.insertAdjacentHTML("beforebegin", LIST.slice(SHOWN, SHOWN + BATCH).map(card).join(""));
  SHOWN += BATCH;
}
const moreObs = "IntersectionObserver" in window
  ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { moreCards(); watchMore(); } }, {rootMargin: "1200px 0px"}) : null;
function watchMore() { if (!moreObs) { while (SHOWN < LIST.length) moreCards(); return; } moreObs.disconnect(); const m = $("#more"); if (m) moreObs.observe(m); }

// ---------- sheets ----------
function openSheet(html, label) {
  $("#sheet").innerHTML = `<div class="grab"></div><button class="icon-btn close" data-close aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="1.8"><path d="M4 4l10 10M14 4 4 14"/></svg></button>` + html;
  $("#sheet").setAttribute("aria-label", label);
  $("#layer").hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => $("#layer").classList.add("open")));
  $("#sheet").querySelector("[data-close]").focus({preventScroll: true});
}
function closeSheet() {
  $("#layer").classList.remove("open");
  setTimeout(() => { $("#layer").hidden = true; }, 220);
}
function priceChart(c) {                      // step chart of asking price since CarWatch first saw the ad
  const pts = (c.hist || []).map(([d, p]) => [asDate(d).getTime(), p]);
  if (pts.length < 2) return "";
  const x0 = pts[0][0], x1 = Math.max(Date.now(), x0 + 7 * DAY);
  const ps = pts.map(p => p[1]);
  let lo = Math.min(...ps), hi = Math.max(...ps);
  const pad = Math.max((hi - lo) * .2, hi * .02); lo -= pad; hi += pad;
  const W = 320, H = 118, L = 6, R = 6, T = 22, B = 20;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = p => T + (hi - p) / (hi - lo) * (H - T - B);
  let path = `M${X(pts[0][0]).toFixed(1)},${Y(pts[0][1]).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) path += `H${X(pts[i][0]).toFixed(1)}V${Y(pts[i][1]).toFixed(1)}`;
  path += `H${X(x1).toFixed(1)}`;
  const dots = pts.map(([x, p], i) => {
    const col = i === 0 ? "#8d97a5" : p < pts[i - 1][1] ? "#3ccf8e" : "#f2675c";
    return `<circle cx="${X(x).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="3.6" fill="${col}" stroke="#171c23" stroke-width="1.5"/>`;
  }).join("");
  const first = pts[0], last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price went from ${money(first[1])} to ${money(last[1])}">
    <line x1="${L}" x2="${W - R}" y1="${H - B + 4}" y2="${H - B + 4}" stroke="#29313c"/>
    <path d="${path}" fill="none" stroke="#cfd6df" stroke-width="2" stroke-linejoin="round"/>${dots}
    <text class="lab" x="${X(first[0])}" y="${Y(first[1]) - 9}">${kShort(first[1])}</text>
    <text class="lab" x="${W - R}" y="${Y(last[1]) - 9}" text-anchor="end">${kShort(last[1])}</text>
    <text x="${L}" y="${H - 3}">${fmtDate(c.hist[0][0], false)}</text>
    <text x="${W - R}" y="${H - 3}" text-anchor="end">Today</text></svg>`;
}
function historySection(c) {
  const site = SITES[c.source] || {label: c.source};
  const others = DATA.cars.filter(x => x.days != null).map(x => x.days);
  const longer = c.days != null && others.length > 4 ? Math.round(others.filter(v => v < c.days).length / others.length * 100) : null;
  const when = c.days_src === "site"
    ? `<p>Listed on ${esc(site.label)} ${fmtDate(c.listed)}: <b>${c.days} days</b> on the market${longer != null && longer >= 50 ? `, longer than ${longer}% of the cars here` : ""}.</p>`
    : `<p>On CarWatch since ${fmtDate(c.first_seen)}${c.days != null ? ` (${c.days} days)` : ""}. ${esc(site.label)} doesn't show when the ad went up.</p>`;
  const tc = totalChange(c);
  let body = "";
  if (c.hist && c.hist.length > 1) {
    const rows = c.hist.map(([d, p], i) => {
      const diff = i ? p - c.hist[i - 1][1] : 0;
      return `<li><span>${fmtDate(d)}</span><span>${money(p)}${diff ? ` <span class="${diff < 0 ? "dn" : "up"}">(${diff < 0 ? "−" : "+"}${money(Math.abs(diff))})</span>` : ""}</span></li>`;
    }).join("");
    const pct = Math.round(Math.abs(tc.diff) / tc.from * 100);
    body = `${priceChart(c)}<p>${tc.diff < 0 ? `Down ${money(-tc.diff)} (${pct}%)` : tc.diff > 0 ? `Up ${money(tc.diff)} (${pct}%)` : "Back to the first price"}
      since ${fmtDate(tc.since)}, in ${c.hist.length - 1} change${c.hist.length > 2 ? "s" : ""}.</p><ul class="steps">${rows}</ul>`;
  } else {
    body = `<p class="none">Same price since CarWatch first saw it on ${fmtDate(c.hist?.[0]?.[0] || c.first_seen)}.</p>`;
  }
  return `<h3>Price history</h3>${when}${body}`;
}
function soldSection(c) {
  const s = c.sold;
  const conv = c.body === "conv";
  const band = DATA.sold_bands?.[`${c.family}|${conv ? "conv" : "fixed"}`];
  const fam = (DATA.families.find(f => f.family === c.family) || {}).label || c.name;
  const gone = (DATA.gone || []).filter(g => g.family === c.family && g.id !== c.id && g.trans !== "a" &&
      (g.body === "conv") === conv && Math.abs(+g.year - (c.year || 0)) <= 2).slice(0, 4);
  if (!s && !band && !gone.length) return "";
  let html = `<h3>${s || band ? "Sold prices" : "Similar ads that left"}</h3>`;
  if (s && s.est) {
    const vs = s.vs;
    const pill = vs > .02 ? `<span class="deal under">ask ${Math.round(vs * 100)}% under</span>`
               : vs < -.02 ? `<span class="deal over">ask ${Math.round(-vs * 100)}% over</span>` : `<span class="deal">ask about the same</span>`;
    html += `<div class="est"><b>${money(s.est)}</b>${pill}</div>
      <p class="none">Median of ${s.refs.length} similar manual cars sold on Bring a Trailer (US), each adjusted to this car's km and year.</p>`;
  } else if (s && s.refs.length) {
    html += `<p class="none">Only ${s.refs.length} close sale${s.refs.length > 1 ? "s" : ""} on Bring a Trailer: too few for an estimate.</p>`;
  }
  if (s && s.refs.length) {
    html += `<ul class="comps">${s.refs.map(([i, adj]) => {
      const x = DATA.comps[i];
      return `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">
        <span class="t">${esc(x.t)}</span><span class="p">${money(x.cad)}</span>
        <span class="m">${fmtDate(x.sold)}, ${x.km != null ? x.km.toLocaleString("en-CA") + " km" : "km not stated"}</span>
        <span class="a">${money(adj)} for this car</span></a></li>`;
    }).join("")}</ul>`;
  }
  if (band) html += `<p style="margin-top:10px">All manual ${esc(fam)} sales there in the last 2 years (${conv ? "convertibles only" : "no convertibles"}):
      half went for ${money(band.p25)} to ${money(band.p75)}, median ${money(band.med)}, ${band.n} sales.</p>`;
  if (gone.length) html += `<p style="margin:12px 0 4px">Similar ads that left CarWatch (often sold):</p><ul class="steps">${gone.map(g =>
      `<li><span>${esc(g.year)}, ${g.km ? Math.round(g.km / 1000) + "k km" : "km n/a"}</span><span><a href="${esc(g.url)}" target="_blank" rel="noopener" style="color:var(--text)">asked ${money(+g.price)}</a>,
        gone ${fmtDate(g.last_seen, false)}${g.days != null ? ` after ${g.days} days` : ""}</span></li>`).join("")}</ul>`;
  if (s || band) html += `<p class="fine">US auction prices in Canadian dollars at the Bank of Canada rate of the sale day. They are hammer prices: the buyer also pays a 5% fee, and importing adds duty, tax and fees.</p>`;
  return html;
}
function detailSheet(c) {

  const redPts = c.red.reduce((a, f) => a + (sc.red[f] || 0), 0);
  const greenPts = Math.min(sc.green_cap, c.green.reduce((a, f) => a + (sc.green[f] || 0), 0));
  const valuePts = c.score == null ? 0 : c.score - sc.base - gearPts - redPts - greenPts;
  const pts = v => (v > 0 ? "+" : "") + v.toFixed(1);
  openSheet(`
    <h2><span class="pill" style="--c:${nameColor(c.name)}">${esc(c.name)}</span>${c.year ?? ""}</h2>
    <p class="sub">${esc([c.trim, BODY[c.body], money(c.price)].filter(Boolean).join(", "))}</p>
    <h3>Ad details</h3>
    <p>${esc(c.note)}</p>
    ${c.desc ? `<div class="desc">${esc(c.desc)}${c.desc.length >= 690 ? "…" : ""}</div>` : ""}
    <h3>Red flags</h3>
    ${c.red.length ? `<div class="flags">${c.red.map(f => `<span class="flag${HARD.includes(f) ? " hard" : ""}">${esc(f)}</span>`).join("")}</div>`
                   : `<p class="none">${c.flags_read ? "None found in the ad text." : "Ad text not read yet."}</p>`}
    <h3>Good signs</h3>
    ${c.green.length ? `<div class="good-list">${c.green.map(f => `<span class="plus">${esc(f)}</span>`).join("")}</div>`
                     : `<p class="none">${c.flags_read ? "None mentioned." : "Ad text not read yet."}</p>`}
    <h3>Price and score</h3>
    <dl class="kv">
      <dt>Listed</dt><dd>${money(c.price)}${c.prev_price && c.prev_price !== c.price ? ` (was ${money(c.prev_price)})` : ""}${c.red.includes("Price hidden")
        ? `<br><span class="none">The ad now shows no real price (often $1): this is the last price it showed. Often means a sale is pending.</span>` : ""}</dd>
      <dt>Fair price</dt><dd>${c.fair ? money(c.fair) + ` for this car, km and year` : "Not enough cars to estimate"}</dd>
      <dt>Score</dt><dd><b style="color:${scoreColor(c.score)}">${c.score?.toFixed(1) ?? "–"}</b> of 10:
        price ${pts(valuePts)}, gearbox ${pts(gearPts)}, flags ${pts(redPts + greenPts)}</dd>
      <dt>Confidence</dt><dd>${c.conf != null ? Math.round(c.conf * 100) + "% (fewer cars of this model = less weight on price)" : "n/a"}</dd>
    </dl>
    ${historySection(c)}
    ${soldSection(c)}
    <h3>The car</h3>
    <dl class="kv">
      <dt>Gearbox</dt><dd>${esc(g.long)}</dd>
      <dt>Km</dt><dd>${c.km != null ? c.km.toLocaleString("en-CA") + " km" : "n/a"}</dd>
      <dt>Body</dt><dd>${BODY[c.body] || "n/a"}</dd>
      <dt>Location</dt><dd>${esc(c.place || "n/a")}</dd>
      <dt>Listed on</dt><dd>${esc(site.label)}${c.listed ? `, ${fmtDate(c.listed)}` : ""}</dd>
      <dt>First seen</dt><dd>${esc(c.first_seen)}</dd>
      <dt>Last checked</dt><dd>${esc(c.verified || c.last_seen)}</dd>
    </dl>
    <a class="primary" href="${esc(c.url)}" target="_blank" rel="noopener">Open ad on ${esc(site.label)}</a>`, "Car details");
}
function filterSheet() {
  const prices = DATA.cars.map(c => c.price), kms = DATA.cars.map(c => c.km || 0), years = DATA.cars.map(c => c.year).filter(Boolean);
  const pMax = Math.ceil(Math.max(...prices) / 5000) * 5000, kMax = Math.ceil(Math.max(...kms) / 10000) * 10000;
  const yLo = Math.min(...years), yHi = Math.max(...years);
  const yOpts = sel => { let o = `<option value="0">Any</option>`; for (let y = yLo; y <= yHi; y++) o += `<option ${sel === y ? "selected" : ""}>${y}</option>`; return o; };
  const t = JSON.parse(JSON.stringify(state));
  const opt = (group, val, label, on) => `<button class="opt" data-g="${group}" data-v="${val}" aria-pressed="${on}">${label}</button>`;
  openSheet(`
    <h2>Filters</h2>
    ${AUTO ? "" : `<h3>Gearbox</h3><div class="opt-group">
      ${opt("gear", "m", "Manual", t.gear.includes("m"))}${opt("gear", "c", "Check gearbox", t.gear.includes("c"))}${opt("gear", "u", "Manual?", t.gear.includes("u"))}</div>`}
    <h3>Body</h3><div class="opt-group">
      ${["coupe", "conv", "sedan", "wagon"].map(b => opt("body", b, BODY[b], t.bodies.includes(b))).join("")}</div>
    <h3>Highest price</h3><div class="range"><input type="range" id="fPrice" min="5000" max="${pMax}" step="1000" value="${t.maxPrice || pMax}"><output id="oPrice"></output></div>
    <h3>Most km</h3><div class="range"><input type="range" id="fKm" min="10000" max="${kMax}" step="5000" value="${t.maxKm || kMax}"><output id="oKm"></output></div>
    <h3>Year</h3><div class="range"><select id="fY1" class="opt">${yOpts(t.yearFrom)}</select><span>to</span><select id="fY2" class="opt">${yOpts(t.yearTo)}</select></div>
    <h3>Hide</h3><div class="opt-group">
      ${opt("hide", "hard", "Rebuilt or salvage titles", t.hideHard)}${opt("hide", "red", "Any red flag", t.hideRed)}</div>
    <h3>More ways to sort</h3><div class="opt-group">
      ${[["score", "Score"], ["price", "Price"], ["deal", "% under fair"], ["sold", "% under sold"], ["days", "Longest listed"],
         ["km", "Km"], ["year", "Year"], ["new", "Newest ads"]]
        .map(([v, l]) => opt("sort", v, l, t.sort === v)).join("")}</div>
    <div class="sheet-actions"><button id="fReset">Reset</button><button class="go" id="fApply">Show cars</button></div>`, "Filters");
  const sh = $("#sheet");
  const upd = () => {
    const p = +$("#fPrice").value, k = +$("#fKm").value;
    $("#oPrice").textContent = p >= pMax ? "Any" : money(p);
    $("#oKm").textContent = k >= kMax ? "Any" : k.toLocaleString("en-CA") + " km";
  };
  upd();
  $("#fPrice").oninput = $("#fKm").oninput = upd;
  sh.querySelectorAll(".opt[data-g]").forEach(b => b.onclick = () => {
    const g = b.dataset.g, v = b.dataset.v;
    if (g === "sort") { sh.querySelectorAll('[data-g=sort]').forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true");
  });
  $("#fReset").onclick = () => { Object.assign(state, DEFAULT_STATE, {names: state.names}); closeSheet(); render(); };
  $("#fApply").onclick = () => {
    const on = g => [...sh.querySelectorAll(`[data-g=${g}][aria-pressed=true]`)].map(b => b.dataset.v);
    const gear = on("gear");
    state.gear = gear.length ? gear : ["m", "c", "u"];
    state.bodies = on("body");
    state.maxPrice = +$("#fPrice").value >= pMax ? 0 : +$("#fPrice").value;
    state.maxKm = +$("#fKm").value >= kMax ? 0 : +$("#fKm").value;
    state.yearFrom = +$("#fY1").value; state.yearTo = +$("#fY2").value;
    const hide = on("hide"); state.hideHard = hide.includes("hard"); state.hideRed = hide.includes("red");
    const srt = on("sort")[0] || "score";
    if (srt !== state.sort) { state.sort = srt; state.dir = ["price", "km"].includes(srt) ? "asc" : "desc"; }
    closeSheet(); render(); window.scrollTo({top: 0});
  };
}
function menuSheet() {
  const repo = DATA.repo;
  const gone = DATA.gone.slice(0, 15).map(g => `<li><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.year + " " + g.name)}</a>, ${money(+g.price)}, gone ${fmtDate(g.last_seen, false)}${g.days != null ? ` after ${g.days} days` : ""}</li>`).join("");
  openSheet(`
    <h2>CarWatch</h2>
    <p class="sub">${DATA.cars.length} cars, ${ago(DATA.updated)}. The list refreshes every morning.</p>
    <nav class="menu">
      ${repo ? `<a href="https://github.com/${esc(repo)}/actions/workflows/update.yml" target="_blank" rel="noopener">
        <span>Update now<small>Opens GitHub: press "Run workflow". New data shows here in about 10 minutes.</small></span></a>` : ""}
      <button id="howScore"><span>How the score works<small>Price against similar cars, gearbox certainty and flags</small></span></button>
      ${(DATA.links || []).length ? `<button id="menuLinks"><span>Search OLX and Webmotors<small>Sites CarWatch can't read: one-tap searches per car</small></span></button>` : ""}
      <button id="menuCountry"><span>Switch to ${COUNTRIES[CUR().next].name}<small>Or tap the flag next to the name</small></span></button>
    </nav>
    ${gone ? `<h3>Recently sold or removed</h3><ul class="gone">${gone}</ul>` : ""}`, "Menu");
  if ($("#menuLinks")) $("#menuLinks").onclick = () => linksSheet();
  $("#menuCountry").onclick = () => confirmCountry();
  $("#howScore").onclick = () => openSheet(`
    <h2>How the score works</h2>
    <p>Every car starts at ${DATA.score.base} of 10. The fair price is estimated from the other cars of the same model,
      adjusted for km, year and convertible or not. Each ${Math.round(DATA.score.pct_per_point * 100)}% under that fair price adds about a point,
      and each ${Math.round(DATA.score.pct_per_point * 100)}% over it removes one. For models with only a few cars listed, the price counts less.</p>
    <p>Gearbox: a doubtful manual costs up to a point. Red flags from the ad text take points off (a rebuilt title costs 3);
      good signs such as rod bearings done add up to ${DATA.score.green_cap}.</p>
    ${COUNTRY === "CA" ? `<p>Sold prices from Bring a Trailer show in each car's details but don't change the score: they are US auction results,
      a different market from Canadian asking prices. Use them as a check on the fair price.</p>` :
      `<p>In Brazil the list comes from NaPista and Mobiauto. OLX and Webmotors block automated reading, so check them with the
      search buttons at the top of the list.</p>`}
    <p class="none">Flags only catch what the seller wrote. Get a history report and an inspection before you buy.</p>`, "How the score works");
}

function linksSheet() {
  const sel = new Set(state.names);
  const famOf = n => (DATA.names.find(x => x.name === n) || {}).family;
  const selFams = new Set([...sel].map(famOf));
  const groups = [...DATA.links].sort((a, b) => (b.families.some(f => selFams.has(f)) ? 1 : 0) - (a.families.some(f => selFams.has(f)) ? 1 : 0));
  openSheet(`
    <h2>Search other sites</h2>
    <p class="sub">OLX and Webmotors block automated reading, so their ads aren't scored here. These open each site's search for the car.</p>
    <div class="linkset">${groups.map(g => `<div><h3>${esc(g.model)}</h3><div class="btns">${g.links.map(l =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.site)}</a>`).join("")}</div></div>`).join("")}</div>`, "Search other sites");
}
function setAuto(on) {
  if (on === AUTO || !MAN_DATA) return;
  if (!on) { AUTO = false; DATA = MAN_DATA; return paintMode(); }
  if (AUTO_DATA) { AUTO = true; DATA = AUTO_DATA; return paintMode(); }
  const want = COUNTRY;
  $("#meta").textContent = "Loading automatics…";
  fetch("data/" + MAN_DATA.auto_file + "?" + Date.now(), {cache: "no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { if (want !== COUNTRY) return; AUTO_DATA = d; AUTO = true; DATA = d; paintMode(); })
    .catch(err => { $("#meta").textContent = `Automatics could not be loaded (${err.message})`; });
}
function paintMode() {
  document.querySelector(".top").classList.toggle("auto-on", AUTO);
  $("#meta").textContent = `${DATA.cars.length} ${AUTO ? "automatic " : ""}cars, ${ago(DATA.updated)}`;
  window.scrollTo({top: 0});
  render();
}
function confirmCountry() {
  const to = COUNTRIES[CUR().next];
  openSheet(`
    <h2>Change store?</h2>
    <p class="sub">Are you sure you want to change to the ${to.adj} store?</p>
    <div class="confirm"><button class="primary" id="doSwitch" type="button">Change to ${to.name}</button>
      <button data-close type="button">Stay in ${esc(CUR().name)}</button></div>`, "Change store");
  $("#doSwitch").onclick = () => { closeSheet(); switchCountry(); };
}
function paintFlag() {
  const b = $("#flagBtn");
  b.innerHTML = FLAGS[COUNTRY];
  b.setAttribute("aria-label", `Showing ${CUR().name}. Switch to ${COUNTRIES[CUR().next].name}`);
  b.title = `Switch to ${COUNTRIES[CUR().next].name}`;
}
function switchCountry() {
  save();
  COUNTRY = CUR().next;
  try { localStorage.setItem("cw-country", COUNTRY); } catch (e) {}
  state = load();
  paintFlag();
  window.scrollTo({top: 0});
  boot();
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-close]") || t.id === "scrim") return closeSheet();
  const info = t.closest("[data-info]");
  if (info) { e.stopPropagation(); return detailSheet(DATA.cars.find(c => c.id === info.dataset.info)); }
  const gmb = t.closest("[data-gm]");
  if (gmb) return setAuto(gmb.dataset.gm === "a");
  const chip = t.closest(".chip");
  if (chip) {
    const n = chip.dataset.name;
    state.names = !n ? [] : state.names.includes(n) ? state.names.filter(x => x !== n) : [...state.names, n];
    return render();
  }
  if (t.id === "clearAll") { Object.assign(state, DEFAULT_STATE); return render(); }
  if (t.closest("#othersBtn")) return linksSheet();
  const cardEl = t.closest(".card");
  if (cardEl) { const c = DATA.cars.find(x => x.id === cardEl.dataset.id); if (c) window.open(c.url, "_blank", "noopener"); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#layer").hidden) closeSheet();
  if (e.key === "Enter" && e.target.classList?.contains("card")) e.target.click();
});
document.addEventListener("error", e => {          // photo fallback: second address, then "No photo"
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("pic")) return;
  if (img.dataset.alt) { const a = img.dataset.alt; img.dataset.alt = ""; img.src = a; return; }
  img.remove(); const ph = document.querySelector(`[data-id="${CSS.escape(img.closest?.(".card")?.dataset.id || "")}"] .nophoto`);
  if (ph) ph.hidden = false;
}, true);
$("#sortScore").onclick = () => { if (state.sort !== "score") { state.sort = "score"; state.dir = "desc"; } render(); };
$("#sortPrice").onclick = () => { if (state.sort !== "price") { state.sort = "price"; state.dir = "asc"; } render(); };
$("#dirBtn").onclick = () => { state.dir = state.dir === "asc" ? "desc" : "asc"; render(); };
$("#filtersBtn").onclick = () => filterSheet();
$("#menuBtn").onclick = () => menuSheet();
$("#flagBtn").onclick = () => confirmCountry();

function boot() {
  const want = COUNTRY;
  DATA = MAN_DATA = AUTO_DATA = null;
  AUTO = false;
  document.querySelector(".top").classList.remove("auto-on");
  $("#meta").textContent = "Loading…";
  $("#chips").innerHTML = "";
  $("#list").innerHTML = "";
  fetch(CUR().file + "?" + Date.now(), {cache: "no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status === 404 ? "not built yet" : r.status); return r.json(); })
    .then(d => {
      if (want !== COUNTRY) return;                  // switched again while loading
      DATA = MAN_DATA = d;
      state.names = state.names.filter(n => d.names.some(x => x.name === n));
      $("#meta").textContent = `${d.cars.length} cars, ${ago(d.updated)}`;
      render();
    })
    .catch(err => {
      if (want !== COUNTRY) return;
      $("#meta").textContent = "";
      $("#list").innerHTML = err.message === "not built yet"
        ? `<div class="empty">The ${esc(CUR().name)} list appears after the next daily update. Tap the flag to go back.</div>`
        : `<div class="empty">The car list could not be loaded (${esc(err.message)}). Check your connection and pull down to refresh.</div>`;
    });
}
paintFlag();
boot();
</script>
</body>
</html>
