<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>CarWatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1318; --surface:#171c23; --raised:#1e242d; --line:#29313c;
  --text:#eef1f4; --muted:#8d97a5; --dim:#5f6876;
  --good:#3ccf8e; --warn:#f0b23e; --bad:#f2675c;
  --radius:14px;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--sans);
  padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #9fb4ff;outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(15,19,24,.92);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-inner{max-width:1100px;margin:0 auto;padding:10px 14px 0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font:700 24px/1 var(--cond);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.flag-btn{display:flex;align-items:center;padding:6px 4px;margin:-6px -4px;border-radius:5px;line-height:0;
  background:none;border:0;box-shadow:none;cursor:pointer}
.flag-btn:hover .cflag{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.flag-btn:active .cflag{transform:scale(.94)}
.cflag{height:.72em;width:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.12);display:block;transition:transform .12s}
.others{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.others b{color:var(--text);font-weight:600}
.others button{margin-left:auto;padding:8px 14px;border-radius:999px;background:var(--raised);color:var(--text);font-weight:600;white-space:nowrap}
.others{flex-wrap:wrap}
.others .ob{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.others .ob button{margin-left:0}
.others .ob button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.others .ob .n{opacity:.7;font-weight:500}
#sheet .sub a,#sheet p a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
.tag.grp{background:#dfe8ff;color:#122046}
.evpaste{display:flex;gap:8px;align-items:stretch;margin:4px 0 6px}
.evpaste textarea{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:15px/1.35 var(--sans);resize:vertical}
.evpaste button{padding:0 16px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:700}
.evform{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;margin:12px 0 4px}
.evform label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.evform .wide{grid-column:1/-1}
.evform input,.evform select{width:100%;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:600 16px var(--sans)}
.extnote{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--raised);font-size:14px;color:var(--muted)}
.sheet-actions.wrap{flex-wrap:wrap}
.sheet-actions.wrap button{flex:1 1 40%}
.sheet-actions button:disabled{opacity:.5}
.linkset{display:grid;gap:14px;margin-top:6px}
.linkset h3{margin:0 0 6px!important}
.linkset .btns{display:flex;gap:8px;flex-wrap:wrap}
.linkset a{padding:9px 14px;border-radius:999px;background:var(--raised);color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
.linkset a:hover{background:#252c36}
.brand .meta{color:var(--muted);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--raised);color:var(--text)}

.controls{display:flex;gap:8px;align-items:center;margin-top:10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 16px;border-radius:999px;font:600 15px/1 var(--cond);color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.dir{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;
  color:var(--text);font-size:13px;background:var(--surface)}
.dir svg{transition:transform .2s}
.dir[data-dir=asc] svg{transform:rotate(180deg)}
.filters-btn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13px}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--text);color:var(--bg);font:600 11px/18px var(--sans);
  text-align:center;padding:0 5px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 12px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 15px/1 var(--cond);letter-spacing:.02em}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,#888)}
.gmode{flex:none;display:flex;align-items:center;gap:7px;position:sticky;left:0;z-index:2;padding:7px 12px 7px 11px;
  border-radius:999px;font:600 15px/1 var(--cond);letter-spacing:.02em;
  box-shadow:-14px 0 0 #10141a,10px 0 12px -6px #10141a}
.gmode svg{opacity:.75}
.gmode.is-man{background:linear-gradient(rgba(60,207,142,.16),rgba(60,207,142,.16)),var(--bg);color:#8ef0c0;border:1px solid rgba(60,207,142,.5)}
.gmode.is-auto{background:#f0b23e;color:#1d1505;border:1px solid #f0b23e}
.gmode.inline{position:static;box-shadow:none;margin:4px 0 2px}
.top.auto-on{border-bottom:2px solid #f0b23e}
.auto-note{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;font-size:14px;
  background:rgba(240,178,62,.12);border:1px solid rgba(240,178,62,.45);color:#ffd27e}
.auto-note b{color:#ffe2a6}
.auto-note button{margin-left:auto;padding:8px 14px;border-radius:999px;background:#f0b23e;color:#1d1505;font-weight:600;white-space:nowrap}
.fact.gb-a{background:rgba(240,178,62,.10);color:#ffd27e;border-color:rgba(240,178,62,.3)}
.confirm{display:grid;gap:10px;margin-top:20px}
.confirm button{padding:14px;border-radius:12px;font:600 16px/1 var(--sans);background:var(--raised);color:var(--text)}
.confirm .primary{background:var(--text);color:var(--bg)}
#more{grid-column:1/-1;height:1px}
.locrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;overflow-x:auto;margin:0 0 12px;padding:2px 0;scrollbar-width:none}
.locrow::-webkit-scrollbar{display:none}
.locpin{flex:none;display:grid;place-items:center;width:36px;height:36px;margin-right:-2px;color:var(--muted)}
.loc{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font:600 14px/1 var(--sans);white-space:nowrap}
.loc[aria-pressed=true]{background:rgba(59,143,224,.18);border-color:rgba(59,143,224,.65);color:#c4e2ff}
.loc .r{margin-left:6px;font-weight:500;opacity:.75}
.loc.edit{color:var(--text);background:none}
.place .dist{color:#9ccaf5;margin-left:4px}
.favs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.favs li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--raised)}
.favs li span{flex:1}
.favs button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600}
.addtown{display:flex;gap:8px;margin-top:6px}
.addtown input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:16px var(--sans)}
.addtown button{padding:0 16px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:600}
.addmsg{color:var(--muted);font-size:13px;min-height:1.2em;margin-top:6px}
.chip .n{font:500 12px/1 var(--sans);color:var(--dim)}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--c,#cfd6df);background:color-mix(in srgb,var(--c,#cfd6df) 18%,var(--surface))}
.chip[aria-pressed=true] .n{color:var(--muted)}

/* ---------- list ---------- */
main{max-width:1100px;margin:0 auto;padding:12px 10px 40px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){main{grid-template-columns:1fr 1fr;padding:16px 14px 48px}}
@media(min-width:1080px){main{grid-template-columns:1fr 1fr 1fr}}
.count{grid-column:1/-1;color:var(--muted);font-size:13px;padding:0 4px}
.count .lvl{display:block;margin-top:3px;color:#9ccaf5}
.favs li small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column}
.card:hover{border-color:#3a4452}
.photo{position:relative;aspect-ratio:16/10;background:#0b0e12}
.photo img.pic{width:100%;height:100%;object-fit:cover;display:block}
.photo .nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px}
.photo .nophoto[hidden]{display:none}
.card.ext .photo{aspect-ratio:auto;height:112px}
.card.ext .nophoto{display:none}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;
  background:linear-gradient(to top,rgba(10,13,17,.78),rgba(10,13,17,0));pointer-events:none}
.name{position:absolute;left:10px;top:10px;z-index:2;background:var(--c);color:#fff;border-radius:8px;
  padding:5px 10px 4px;font:700 20px/1 var(--cond);letter-spacing:.02em;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.gauge{position:absolute;right:8px;top:8px;z-index:2;width:66px;height:66px;border-radius:50%;
  background:rgba(12,15,20,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.gauge svg{position:absolute;inset:0}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font:700 25px/1 var(--cond);padding-bottom:2px}
.gauge small{position:absolute;left:0;right:0;bottom:7px;text-align:center;font:500 10px/1 var(--sans);color:var(--muted)}
.src{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:6px;
  background:rgba(12,15,20,.78);border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;color:#d8dde4}
.src img{width:16px;height:16px;border-radius:4px;background:#fff}
.tags{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;gap:6px}
.tag{border-radius:999px;padding:3px 9px;font:600 12px/1.4 var(--sans)}
.tag.new{background:#e9eef5;color:#10151c}
.tag.drop{background:rgba(60,207,142,.18);color:#7ff0bb;border:1px solid rgba(60,207,142,.4)}
.tag.rise{background:rgba(242,103,92,.18);color:#ffb0a8;border:1px solid rgba(242,103,92,.4)}
.tag.age{background:rgba(12,15,20,.78);color:#d8dde4;font-weight:500}
.tag.age.long{color:#ffd27e;box-shadow:inset 0 0 0 1px rgba(240,178,62,.45)}

.body{padding:11px 14px 13px;display:flex;flex-direction:column;gap:9px}
.row1{display:flex;align-items:center;gap:10px}
.price{font:700 28px/1 var(--cond);letter-spacing:.01em}
.deal{font-size:13px;font-weight:600;color:var(--muted);border-radius:7px;padding:4px 8px;border:1px solid var(--line)}
.deal.under{color:#8ef0c0;background:rgba(60,207,142,.12);border-color:rgba(60,207,142,.3)}
.deal.over{color:#ffaaa2;background:rgba(242,103,92,.12);border-color:rgba(242,103,92,.32)}
.deal b{font-weight:700;margin-left:2px}
.dl-great{color:#9cf0c6;background:rgba(47,156,102,.28);border-color:rgba(47,156,102,.6)}
.dl-good{color:#a8e6c4;background:rgba(98,185,138,.14);border-color:rgba(98,185,138,.38)}
.dl-fair{color:var(--muted)}
.dl-high{color:#f5c58e;background:rgba(201,138,69,.14);border-color:rgba(201,138,69,.38)}
.dl-over{color:#ffaaa2;background:rgba(210,100,91,.16);border-color:rgba(210,100,91,.42)}
.dl-sus{color:#cdc6ff;background:rgba(144,133,233,.2);border-color:rgba(144,133,233,.6)}
.verdict{margin:12px 0 4px;padding:13px 14px 12px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.verdict.v-great,.verdict.v-good{border-color:rgba(98,185,138,.45)}
.verdict.v-high,.verdict.v-over{border-color:rgba(210,100,91,.4)}
.verdict.v-sus{border-color:rgba(144,133,233,.65)}
.v-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.v-head b{font:700 21px/1.1 var(--cond);letter-spacing:.01em}
.v-head span{color:var(--muted);font-size:14px}
.verdict .viz text{font:500 11px var(--sans);fill:var(--muted)}
.verdict .viz text.vl{fill:var(--text);font-weight:700}
.verdict .kv{margin:8px 0 0}
ul.why{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.warnline{margin:8px 0 0;padding:9px 11px;border-radius:10px;background:rgba(144,133,233,.16);color:#d9d4ff;font-size:14px}
.fine{color:var(--muted);font-size:12px;margin:8px 0 0}
ol.checks{margin:6px 0 0;padding-left:20px;display:grid;gap:10px;font-size:14px}
ol.checks .m{color:var(--muted)}
.src-link{color:#9ccaf5;font-size:12px}
.guide .mix{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.guide .mix .deal{font-size:12px}
ul.facts-list.plain{list-style:none;padding-left:0}
ul.facts-list.plain .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}
.info{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--muted);flex:none}
.info:hover{color:var(--text);border-color:#4a5563}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:4px 8px;font:500 13px/1.25 var(--sans);
  background:var(--raised);color:#d3d9e1;border:1px solid transparent}
.fact.year{font:700 15px/1.1 var(--cond);letter-spacing:.03em}
.fact.km{position:relative;overflow:hidden;padding-bottom:6px}
.fact.km i{position:absolute;left:0;bottom:0;height:3px;background:#e0a34a;border-radius:0 2px 2px 0}
.fact.gb-m{background:rgba(60,207,142,.13);color:#8ef0c0;border-color:rgba(60,207,142,.3)}
.fact.gb-c{background:rgba(240,178,62,.14);color:#ffd27e;border-color:rgba(240,178,62,.35)}
.fact.gb-u{background:var(--raised);color:var(--muted);border-color:var(--line)}
.fact.body-coupe{box-shadow:inset 3px 0 0 #8b84e8}
.fact.body-conv{box-shadow:inset 3px 0 0 #e0a34a}
.fact.body-sedan{box-shadow:inset 3px 0 0 #8fa3b8}
.fact.body-wagon{box-shadow:inset 3px 0 0 #b9875a}
.fact.trim{background:none;border-color:var(--line);color:var(--text)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{border-radius:7px;padding:4px 8px;font:600 13px/1.25 var(--sans);background:rgba(242,103,92,.14);color:#ffaaa2;
  border:1px solid rgba(242,103,92,.35)}
.flag.hard{background:#d9483d;color:#fff;border-color:#d9483d}
.place{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px}
.empty button{margin-top:12px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);color:var(--text)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:40;opacity:0;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--surface);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){.sheet{left:50%;right:auto;width:560px;bottom:auto;top:50%;border-radius:18px;border:1px solid var(--line);
  transform:translate(-50%,-46%);opacity:0;transition:opacity .18s,transform .18s}}
.open .scrim{opacity:1}
.open .sheet{transform:translateY(0)}
@media(min-width:760px){.open .sheet{transform:translate(-50%,-50%);opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
@media(min-width:760px){.grab{display:none}}
.sheet h2{font:700 26px/1.05 var(--cond);margin:4px 0 2px;display:flex;align-items:center;gap:10px}
.sheet h2 .pill{background:var(--c);color:#fff;border-radius:7px;padding:4px 9px 3px;font-size:20px}
.sheet .sub{color:var(--muted);margin:0 0 6px}
.sheet h3{font:600 17px/1.2 var(--cond);letter-spacing:.02em;color:var(--muted);margin:18px 0 8px}
.sheet p{margin:0 0 8px;max-width:68ch}
.desc{color:#cfd5dd;font-size:14px;max-height:9.5em;overflow:auto;border-left:2px solid var(--line);padding-left:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.good-list{display:flex;flex-wrap:wrap;gap:6px}
.plus{border-radius:7px;padding:4px 8px;font:600 13px/1.25 var(--sans);background:rgba(60,207,142,.12);color:#8ef0c0;
  border:1px solid rgba(60,207,142,.3)}
.none{color:var(--dim);font-size:14px}
.primary{display:block;width:100%;margin-top:20px;padding:13px;border-radius:12px;background:var(--text);color:var(--bg);
  font:700 18px/1 var(--cond);letter-spacing:.03em;text-align:center;text-decoration:none}
.close{position:absolute;right:10px;top:10px}

.opt-group{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 13px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.opt[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:#cfd6df}
select.opt{background:var(--raised);color:var(--text);padding:8px 12px;font-size:15px}
.range output{min-width:92px;text-align:right;font:600 17px/1 var(--cond)}
.sheet-actions{display:flex;gap:10px;margin-top:22px}
.sheet-actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.sheet-actions .go{background:var(--text);color:var(--bg);border-color:var(--text)}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:16px;text-align:left}
.menu small{display:block;color:var(--muted);font-size:13px}
.gone a{color:var(--text)}
.chart{display:block;width:100%;height:auto;margin:2px 0 6px}
.chart text{font:500 11px var(--sans);fill:var(--muted)}
.chart .lab{font:700 13px var(--cond);fill:var(--text)}
.steps{list-style:none;margin:0;padding:0;font-size:14px;display:grid;gap:3px}
.steps li{display:flex;gap:10px}
.steps span:first-child{color:var(--muted);min-width:7.5em}
.dn{color:#8ef0c0} .up{color:#ffaaa2}
.est{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.est b{font:700 26px/1 var(--cond)}
.comps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}

.comps a:hover{background:#252c36}

.comps .a{grid-row:2;grid-column:2;text-align:right;color:var(--muted);font-size:12px}
.fine{color:var(--dim);font-size:13px;margin-top:8px!important}
/* ---------- prices tab ---------- */
.tabs{display:flex;gap:6px;margin:9px 0 -3px;border-bottom:1px solid var(--line)}

.tabs button svg{opacity:.85}

.tabs button[aria-selected=true]{color:var(--text);background:var(--raised);border-bottom-color:#5aa2f0}

.top.prices .controls{display:none}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{display:block;font:600 23px/1.15 var(--sans);margin:4px 0 3px}
.kpi span{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.ana{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 13px;min-width:0}
.ana h2{margin:0;font:700 20px/1.15 var(--cond);letter-spacing:.01em}
.ana > .sub{margin:3px 0 10px;color:var(--muted);font-size:13px;line-height:1.35}
.ana h3{margin:14px 0 6px;font:600 13px/1.3 var(--sans);color:var(--muted)}
.ana p{margin:8px 0 0;font-size:14px}
.ana .none{color:var(--muted)}
.ana .m{color:var(--muted);font-size:12px}
.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font:500 11px var(--sans);fill:var(--muted)}
.viz .vl{fill:var(--text);font-weight:600}
.legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:2px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:3px}
.legend .ln{display:inline-block;width:16px;height:2px;border-radius:1px;background:#8d97a5;margin-left:10px}
.readout{display:flex;align-items:center;gap:10px;min-height:46px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--raised);font-size:13px;color:var(--muted)}
.readout b{color:var(--text);font-size:15px}
.readout button,.rows button{color:var(--text)}
.readout button{margin-left:auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-weight:600}
ul.facts-list{margin:2px 0 0;padding-left:18px;display:grid;gap:7px;font-size:14px}
.rows{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.rows button{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 11px;border-radius:10px;background:var(--raised);text-align:left;font-size:14px}
.rows b{text-align:right;font:700 16px/1.2 var(--cond)}
.rows .wide{grid-column:1/-1}
.linkbtn{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1px solid var(--line);font-weight:600;color:var(--text)}
.otab{width:100%;border-collapse:collapse;font-size:14px}
.otab caption{caption-side:top;text-align:left;color:var(--muted);font-size:12px;padding:10px 0 2px}
.budget-in{display:flex;align-items:center;gap:8px;margin-top:4px}
.budget-in label{color:var(--muted);font-size:14px}
.budget-in input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:600 17px var(--sans)}
.budget-in button{padding:10px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:700}

.bud-picks button[aria-pressed=true]{color:var(--text);border-color:var(--text);background:var(--raised)}

#fipeHist text.vl{fill:var(--text);font-weight:600}

.otab th{color:var(--muted);font-weight:500;font-size:12px;text-align:right;padding:2px 4px 6px}
.otab td{padding:10px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.otab th:first-child,.otab td:first-child{text-align:left;padding-left:0}
.otab tr[data-ana]{cursor:pointer}
.otab td.m{color:var(--muted);font-size:13px}
.loc-card{border-color:rgba(59,143,224,.45)}
.ygrid{display:grid;gap:3px;font-size:12px;text-align:center;margin-top:4px}
.ygrid .gh{color:var(--muted);padding:2px 0 4px}
.ygrid .gy{text-align:left;font-weight:600;align-self:center}
.ygrid .gc{padding:7px 0 5px;border-radius:6px;font:600 13px/1.1 var(--sans);display:flex;flex-direction:column;align-items:center;gap:1px}
.ygrid .gc small{font-size:11px;font-weight:500;opacity:.8}
.ygrid .gc.few{color:var(--muted);background:rgba(105,113,125,.1);justify-content:center}
.minisw{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:12px;color:var(--muted)}
.minisw button{padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600}
.minisw button[aria-pressed=true]{color:var(--text);border-color:var(--text)}
.legend .bandkey{width:16px;height:9px;border-radius:2px;background:rgba(141,151,165,.35);margin-left:10px}
.breakdown dd{font-variant-numeric:tabular-nums}
.otab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}
@media (max-width:380px){.controls{gap:6px}.seg button{padding:7px 11px}.dir,.filters-btn{padding:8px 10px}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

        <button id="sortScore" aria-pressed="true">Score</button>
        <button id="sortPrice" aria-pressed="false">Price</button>

      <button class="dir" id="dirBtn" data-dir="desc" aria-label="Sort direction">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 2v10M3 8l4 4 4-4"/></svg>
        <span id="dirLabel">High first</span>
      </button>
      <button class="filters-btn" id="filtersBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>
        <span id="fLabel">Filters</span> <span class="badge" id="fCount" hidden>0</span>
      </button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Car"></div>
  </div>
</header>

<main id="list" aria-live="polite"></main>

<div id="layer" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>

<script>

const $ = s => document.querySelector(s);

const FLAGS = {

  "Rod bearings done": "Bronzinas trocadas", "Subframe reinforced": "Subchassi reforçado", "VANOS/timing done": "VANOS/corrente feitos",
  "Clutch done": "Embreagem trocada", "Service records": "Revisões comprovadas", "No accidents stated": "Sem batida ou leilão",
  "One owner": "Único dono", "Winter stored": "Guardado no inverno", "Gearbox serviced": "Câmbio revisado",
  "Gearbox problem": "Problema no câmbio", "Clutch slipping": "Embreagem patinando",
};
const flagTxt = f => esc(PT() ? FLAG_PT[f] || f : f);
let AUTO = false, MAN_DATA = null, AUTO_DATA = null;     // gearbox mode: always starts on manual, never saved
const LOC_DEFAULTS = {
  BR: [{name: "São Paulo, SP", geo: [-23.533, -46.639]}, {name: "Teresina, PI", geo: [-5.092, -42.803]}],
  CA: [],
};
const RADII = [0, 25, 50, 100, 200, 400];          // km; 0 = that town only
function loadLoc() {
  try {
    const s = JSON.parse(localStorage.getItem("cw-loc-" + COUNTRY) || "null");
    if (s && Array.isArray(s.favs)) return {favs: s.favs, active: s.active || null, radius: RADII.includes(s.radius) ? s.radius : 100};
  } catch (e) {}
  return {favs: (LOC_DEFAULTS[COUNTRY] || []).map(f => ({...f})), active: null, radius: 100};
}
function saveLoc() { try { localStorage.setItem("cw-loc-" + COUNTRY, JSON.stringify(LOC)); } catch (e) {} }
let LOC = loadLoc();
function kmBetween(a, b) {                     // great-circle distance in km
  const R = 6371, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const locLabel = () => !LOC.active ? "" : LOC.radius
  ? L(`within ${LOC.radius} km of ${LOC.active.name}`, `a até ${LOC.radius} km de ${LOC.active.name}`)
  : L(`in ${LOC.active.name}`, `em ${LOC.active.name}`);
const radiusTxt = r => r ? r + " km" : L("town only", "só a cidade");
// Local price level: how far asking prices around a town sit from the national fair price (same model, km, year),
// from every car in the radius, manual and automatic. Few cars: leans on the state level (already shrunk to its region).
function areaLevel(town, radius) {
  const A = DATA && DATA.areas;
  if (!A || !town) return null;
  const uf = town.name.split(",").pop().trim().toUpperCase();
  const st = A.uf[uf] ? A.uf[uf][0] : (A.reg[(A.region_of || {})[uf]] || [0])[0];
  let n = 0, s = 0;
  for (const [la, lo, tn, ts] of A.towns) if (kmBetween(town.geo, [la, lo]) <= (radius || 1)) { n += tn; s += ts; }
  return {lv: (s + A.k * st) / (n + A.k), n, uf, few: n < A.k};
}
function levelTxt(lv) {                        // "2% above the national average"
  const p = Math.exp(lv) - 1, r = Math.round(Math.abs(p) * 100);
  if (r < 1) return L("same as the national average", "na média do Brasil");
  return p > 0 ? L(`${r}% above the national average`, `${r}% acima da média do Brasil`)
               : L(`${r}% below the national average`, `${r}% abaixo da média do Brasil`);
}
let LOCAL = null;                              // {lv, n, uf, few} while a town is selected and the data has levels
const vsOf = c => LOCAL && c._lvs != null ? c._lvs : c.vs_fair;
const scoreOf = c => LOCAL && c._ls != null ? c._ls : c.score;
const money = n => n == null ? "" : CUR().sym + Math.round(n).toLocaleString(CUR().locale);
const kmFmt = n => n == null ? L("km n/a", "km n/d") : (n >= 1000 ? Math.round(n / 1000) + L("k km", " mil km") : n + " km");
const kmFull = n => n.toLocaleString(CUR().locale) + " km";
const SITES = {
  autotrader: {label: "Autotrader", domain: "autotrader.ca"},
  kijiji: {label: "Kijiji", domain: "kijiji.ca"},
  carpages: {label: "CarPages", domain: "carpages.ca"},
  napista: {label: "NaPista", domain: "napista.com.br"},
  mobiauto: {label: "Mobiauto", domain: "mobiauto.com.br"},
  olx: {label: "OLX", domain: "olx.com.br"},
  mercadolivre: {label: "Mercado Livre", domain: "mercadolivre.com.br"},
  webmotors: {label: "Webmotors", domain: "webmotors.com.br"},
  icarros: {label: "iCarros", domain: "icarros.com.br"},
  marketplace: {label: "Marketplace", domain: "facebook.com"},
};
const GEARBOX_PT = {
  m: {cls: "gb-m", label: "Manual", long: "Manual: os dados do anúncio e o texto do vendedor dizem manual."},
  c: {cls: "gb-c", label: "Confirmar câmbio", long: "Os dados do anúncio e o texto do vendedor não batem (manual x automático). Pergunte ao vendedor."},
  u: {cls: "gb-u", label: "Manual?", long: "Os dados dizem manual, mas o texto do vendedor não confirma. Pergunte antes."},
  a: {cls: "gb-a", label: "Automático", long: "Câmbio automático (aparece só com o botão Automático ligado)."},
};
const GB = () => PT() ? GEARBOX_PT : GEARBOX;
const GEARBOX = {
  m: {cls: "gb-m", label: "Manual", long: "Manual: the ad's data and the seller's text both say manual."},
  c: {cls: "gb-c", label: "Check gearbox", long: "The ad's data and the seller's text disagree (manual vs automatic/SMG). Ask the seller."},
  u: {cls: "gb-u", label: "Manual?", long: "The data says manual but the text never confirms it. These cars also came with SMG/DCT, so ask."},
  a: {cls: "gb-a", label: "Automatic", long: "Automatic gearbox (shown only with the Automatic button on)."},

const BODY_EN = {coupe: "Coupe", conv: "Convertible", sedan: "Sedan", wagon: "Wagon", unk: "Body n/a"};
const BODY_PT = {coupe: "Cupê", conv: "Conversível", sedan: "Sedã", wagon: "Perua", unk: "Carroceria n/d"};
const BD = () => PT() ? BODY_PT : BODY_EN;

                       tab: "list", ana: "", budget: 0, ext: false};

function stateKey() { return COUNTRY === "CA" ? "cw-state" : "cw-state-" + COUNTRY; }   // filters kept per country

  try { return Object.assign({}, DEFAULT_STATE, JSON.parse(localStorage.getItem(stateKey()) || "{}")); }

}
function save() { try { localStorage.setItem(stateKey(), JSON.stringify(state)); } catch (e) {} }

function scoreColor(s) {                       // red 0 -> amber 5 -> green 10
  const t = Math.max(0, Math.min(1, (s ?? 0) / 10));
  return `hsl(${Math.round(4 + t * 138)} 72% ${t > .4 && t < .7 ? 52 : 50}%)`;
}
function gauge(s) {                            // 270 degree tach arc
  const r = 27, c = 2 * Math.PI * r, arc = c * .75, val = arc * Math.max(0, Math.min(1, (s ?? 0) / 10));
  const col = scoreColor(s);
  return `<div class="gauge" aria-label="${L("Score", "Nota")} ${s == null ? "n/a" : dec(s)} ${L("out of", "de")} 10">
    <svg viewBox="0 0 66 66"><g transform="rotate(135 33 33)" fill="none" stroke-width="5" stroke-linecap="round">
      <circle cx="33" cy="33" r="${r}" stroke="#2b333e" stroke-dasharray="${arc} ${c}"/>
      <circle cx="33" cy="33" r="${r}" stroke="${col}" stroke-dasharray="${val} ${c}"/></g></svg>

function nameColor(name) {
  const n = DATA.names.find(x => x.name === name) || allNames().find(x => x.name === name);
  return n ? n.color : "#59626e";
}
function yearShade(y) {
  const ys = DATA.cars.map(c => c.year).filter(Boolean);
  const lo = Math.min(...ys), hi = Math.max(...ys), t = hi > lo ? (y - lo) / (hi - lo) : .5;
  return `background:hsl(215 12% ${20 + t * 26}%);color:${t > .55 ? "#0f1318" : "#e9edf2"}`;

function isNew(c) {
  if (!c.first_seen || c.first_seen <= DATA.baseline) return false;

}
const DAY = 864e5;
const asDate = iso => new Date(String(iso).slice(0, 10) + "T12:00:00");
const fmtDate = (iso, yr = true) => asDate(iso).toLocaleDateString(CUR().locale, yr ? {month: "short", day: "numeric", year: "numeric"}
                                                                       : {month: "short", day: "numeric"});
const kShort = n => {                        // $59.5k / R$ 59,5 mil
  if (n < 1000) return money(n);
  const v = Math.round(n / 100) / 10;
  return CUR().sym.trim() + L("", " ") + dec(v, n >= 1e5 || v % 1 === 0 ? 0 : 1) + L("k", " mil");
};
const num = v => dec(v, v % 1 ? 1 : 0);        // 5 / 1,5
const nf = n => n.toLocaleString(CUR().locale);  // 2,798 / 2.798
const scoreTxt = s => s == null ? "–" : s >= 9.95 ? "10" : dec(s);
function daysTag(c) {
  if (c.days == null || (c.days_src !== "site" && c.days < 1)) return "";
  const long = c.days >= 60;
  const tip = c.days_src === "site" ? L("Days since the ad went up", "Dias desde que o anúncio foi publicado")

  return `<span class="tag age${long ? " long" : ""}" title="${tip}">${c.days}${c.days_src === "site" ? "" : "+"} ${L("days", c.days === 1 ? "dia" : "dias")}</span>`;

// Year by year: how much each newer year costs, for the same km and version
function yearSteps(cars, mk) {
  const m = DATA.market?.[mk]?.model;
  if (!m) return null;
  const kmRef = medv(cars.filter(c => c.km).map(c => c.km));
  const g = {};
  cars.forEach(c => {
    if (!c.year || !c.km || !c.price) return;
    const p = c.price * Math.exp(-m[1] * (c.km - kmRef) / 1e4 - verAdj(mk, verOf(c)) - (c.body === "conv" ? DATA.b_conv || 0 : 0));
    (g[c.year] = g[c.year] || []).push(p);
  });
  const ys = Object.keys(g).map(Number).filter(y => g[y].length >= 5).sort((a, b) => a - b);
  const med = Object.fromEntries(ys.map(y => [y, medv(g[y])]));
  const steps = ys.slice(1).map((y, i) => ({y, from: ys[i], step: ys[i] === y - 1 ? med[y] / med[ys[i]] - 1 : null})).filter(s => s.step != null);
  const pos = steps.filter(s => s.step > 0).map(s => s.step), avg = pos.length ? pos.reduce((a, b) => a + b, 0) / pos.length : 0;
  return {ys, med, n: Object.fromEntries(ys.map(y => [y, g[y].length])), steps, avg, kmRef,
          best: steps.filter(s => s.step <= Math.max(.01, avg * .4)), jumps: steps.filter(s => avg && s.step >= Math.max(.06, avg * 1.8))};
}

    ? L(`<b>${s.y}</b> costs no more than ${s.from} (${pctTxt(s.step)} for the same km and version): the newer year is the better buy.`,

    : L(`<b>${s.y}</b> costs only ${pctSmall(s.step)} more than ${s.from}: good value for a newer car.`,
        `<b>${s.y}</b> custa só ${pctSmall(s.step)} a mais que ${s.from}: bom custo-benefício por um carro mais novo.`)));

    const vc = {}; cs.forEach(c => { const v = verOf(c); if (v) vc[v] = (vc[v] || 0) + 1; });
    const ver = Object.entries(vc).sort((a, b) => b[1] - a[1])[0]?.[0] || null, km = medv(cs.filter(c => c.km).map(c => c.km)) || S.kmRef;
    const F = fairAt(mk, +y, km, ver, cs.filter(c => c.body === "conv").length > cs.length / 2, lv);
    return F ? `<li><b>${y}${ver ? " " + esc(ver) : ""}</b>, ~${kmFmt(Math.round(km / 1000) * 1000)}: ${kShort(F * (1 - D.good))} – ${kShort(F * (1 + D.good))}</li>` : "";

  neg.push(L(`Open around ${Math.round(roomOf(name) * 100)}% below the fair price and justify it with what the car needs (tyres, service, km).`,
             `Comece cerca de ${Math.round(roomOf(name) * 100)}% abaixo do preço justo e justifique com o que o carro precisa (pneus, revisões, km).`));
  neg.push(L(`Don't pay over the top of the fair range unless the car is exceptional (full records, one owner, low km).`,

  const sus = cars.filter(c => dealOf(vsOf(c)) === "sus").length;
  const warn = [L(`Prices ${Math.round(D.sus * 100)}%+ under fair${sus ? ` (${sus} ${sus === 1 ? "ad" : "ads"} now)` : ""}: often a scam, an auction car, a write-off or a hidden fault. Ask why before anything else.`,
                  `Preço ${Math.round(D.sus * 100)}%+ abaixo do justo${sus ? ` (${sus} ${sus === 1 ? "anúncio" : "anúncios"} agora)` : ""}: costuma ser golpe, leilão, sinistro ou defeito escondido. Pergunte o motivo antes de tudo.`),

let LIST = [], SHOWN = 0;
const BATCH = 40;                              // cards added per batch as you scroll (light on a phone)
function moreCards() {

const moreObs = "IntersectionObserver" in window

function priceChart(c) {                      // step chart of asking price since CarWatch first saw the ad
  const pts = (c.hist || []).map(([d, p]) => [asDate(d).getTime(), p]);
  if (pts.length < 2) return "";
  const x0 = pts[0][0], x1 = Math.max(Date.now(), x0 + 7 * DAY);
  const ps = pts.map(p => p[1]);
  let lo = Math.min(...ps), hi = Math.max(...ps);
  const pad = Math.max((hi - lo) * .2, hi * .02); lo -= pad; hi += pad;
  const W = 320, H = 118, PL = 6, R = 6, T = 22, B = 20;
  const X = v => PL + (v - x0) / (x1 - x0) * (W - PL - R), Y = p => T + (hi - p) / (hi - lo) * (H - T - B);
  let path = `M${X(pts[0][0]).toFixed(1)},${Y(pts[0][1]).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) path += `H${X(pts[i][0]).toFixed(1)}V${Y(pts[i][1]).toFixed(1)}`;
  path += `H${X(x1).toFixed(1)}`;
  const dots = pts.map(([x, p], i) => {
    const col = i === 0 ? "#8d97a5" : p < pts[i - 1][1] ? "#3ccf8e" : "#f2675c";
    return `<circle cx="${X(x).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="3.6" fill="${col}" stroke="#171c23" stroke-width="1.5"/>`;
  }).join("");
  const first = pts[0], last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L(`Price went from ${money(first[1])} to ${money(last[1])}`, `O preço foi de ${money(first[1])} para ${money(last[1])}`)}">
    <line x1="${PL}" x2="${W - R}" y1="${H - B + 4}" y2="${H - B + 4}" stroke="#29313c"/>
    <path d="${path}" fill="none" stroke="#cfd6df" stroke-width="2" stroke-linejoin="round"/>${dots}
    <text class="lab" x="${X(first[0])}" y="${Y(first[1]) - 9}">${kShort(first[1])}</text>
    <text class="lab" x="${W - R}" y="${Y(last[1]) - 9}" text-anchor="end">${kShort(last[1])}</text>
    <text x="${PL}" y="${H - 3}">${fmtDate(c.hist[0][0], false)}</text>
    <text x="${W - R}" y="${H - 3}" text-anchor="end">${L("Today", "Hoje")}</text></svg>`;
}

               : vs < -.02 ? `<span class="deal over">ask ${Math.round(-vs * 100)}% over</span>` : `<span class="deal">ask about the same</span>`;
    html += `<div class="est"><b>${money(s.est)}</b>${pill}</div>
      <p class="none">Median of ${s.refs.length} similar manual cars sold on Bring a Trailer (US), each adjusted to this car's km and year.</p>`;
  } else if (s && s.refs.length) {
    html += `<p class="none">Only ${s.refs.length} close sale${s.refs.length > 1 ? "s" : ""} on Bring a Trailer: too few for an estimate.</p>`;
  }
  if (s && s.refs.length) {
    html += `<ul class="comps">${s.refs.map(([i, adj]) => {
      const x = DATA.comps[i];
      return `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">
        <span class="t">${esc(x.t)}</span><span class="p">${money(x.cad)}</span>
        <span class="m">${fmtDate(x.sold)}, ${x.km != null ? x.km.toLocaleString("en-CA") + " km" : "km not stated"}</span>
        <span class="a">${money(adj)} for this car</span></a></li>`;
    }).join("")}</ul>`;
  }
  if (band) html += `<p style="margin-top:10px">All manual ${esc(fam)} sales there in the last 2 years (${conv ? "convertibles only" : "no convertibles"}):
      half went for ${money(band.p25)} to ${money(band.p75)}, median ${money(band.med)}, ${band.n} sales.</p>`;
  if (gone.length) html += `${s || band ? `<p style="margin:12px 0 4px">${L("Similar ads that left CarWatch (often sold):", "Anúncios parecidos que saíram do CarWatch (muitas vezes vendidos):")}</p>` : ""}<ul class="steps">${gone.map(g =>
      `<li><span>${esc(g.year)}, ${kmFmt(g.km ? +g.km : null)}</span><span><a href="${esc(g.url)}" target="_blank" rel="noopener" style="color:var(--text)">${L("asked", "pedia")} ${money(+g.price)}</a>,
        ${goneTxt(g)}</span></li>`).join("")}</ul>`;
  if (s || band) html += `<p class="fine">US auction prices in Canadian dollars at the Bank of Canada rate of the sale day. They are hammer prices: the buyer also pays a 5% fee, and importing adds duty, tax and fees.</p>`;
  return html;
}

  $("#fApply").onclick = () => {

  if (!on) { AUTO = false; DATA = MAN_DATA; return paintMode(); }
  if (AUTO_DATA) { AUTO = true; DATA = AUTO_DATA; return paintMode(); }
  const want = COUNTRY;
  $("#meta").textContent = L("Loading automatics…", "Carregando automáticos…");
  fetch("data/" + MAN_DATA.auto_file + "?" + Date.now(), {cache: "no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { if (want !== COUNTRY) return; AUTO_DATA = d; AUTO = true; DATA = d; paintMode(); })
    .catch(err => { $("#meta").textContent = L(`Automatics could not be loaded (${err.message})`, `Não foi possível carregar os automáticos (${err.message})`); });
}
function paintMode() {
  document.querySelector(".top").classList.toggle("auto-on", AUTO);
  $("#meta").textContent = `${nf(DATA.cars.length)} ${AUTO ? L("automatic cars", "carros automáticos") : L("cars", "carros")}, ${ago(DATA.updated)}`;
  window.scrollTo({top: 0});
  render();
}

let TOWNS = null;                               // [[town, UF, lat, lon]] loaded when the location sheet opens
function locSheet(msg = "") {
  openSheet(`
    <h2>${L("Location", "Localização")}</h2>
    <p class="sub">${L("Show cars near a town. Your favourites sit at the top of the list for one tap.",
                       "Mostre carros perto de uma cidade. Suas favoritas ficam no topo da lista, a um toque.")}</p>
    <h3>${L("Distance", "Distância")}</h3><div class="opt-group">${RADII.map(r =>
      `<button class="opt" data-radius="${r}" type="button" aria-pressed="${LOC.radius === r}">${r ? r + " km" : L("Town only", "Só a cidade")}</button>`).join("")}</div>
    <h3>${L("Favourites", "Favoritas")}</h3>
    ${LOC.favs.length ? `<ul class="favs">${LOC.favs.map((f, i) => `<li><span>${esc(f.name)}${(a => a ? `<small>${L("Prices", "Preços")}: ${levelTxt(a.lv)}</small>` : "")(areaLevel(f, LOC.radius))}</span>
      <button data-usefav="${i}" type="button">${LOC.active?.name === f.name ? L("In use", "Em uso") : L("Use", "Usar")}</button>
      <button data-delfav="${i}" type="button" aria-label="${L("Remove", "Remover")} ${esc(f.name)}">${L("Remove", "Remover")}</button></li>`).join("")}</ul>`
      : `<p class="none">${L("No favourites yet.", "Nenhuma favorita ainda.")}</p>`}
    <h3>${L("Add a town", "Adicionar cidade")}</h3>
    <div class="addtown"><input id="townIn" list="townList" placeholder="${L("Type a town, e.g. Campinas", "Digite uma cidade, ex.: Campinas")}" autocomplete="off">
      <button id="townAdd" type="button">${L("Add", "Adicionar")}</button></div>
    <datalist id="townList"></datalist>
    <p class="addmsg" id="townMsg">${esc(msg)}</p>`, L("Location", "Localização"));
  const fill = () => { $("#townList").innerHTML = TOWNS.map(x => `<option value="${esc(x[0] + ", " + x[1])}">`).join(""); };
  if (TOWNS) fill();
  else if (COUNTRY === "BR") fetch("data/geo_br.json").then(r => r.json()).then(d => { TOWNS = d; if ($("#townList")) fill(); }).catch(() => {});
  document.querySelectorAll("[data-radius]").forEach(b => b.onclick = () => { LOC.radius = +b.dataset.radius; saveLoc(); render(); locSheet(); });
  document.querySelectorAll("[data-usefav]").forEach(b => b.onclick = () => { LOC.active = LOC.favs[+b.dataset.usefav]; saveLoc(); render(); locSheet(); });
  document.querySelectorAll("[data-delfav]").forEach(b => b.onclick = () => {
    const [gone] = LOC.favs.splice(+b.dataset.delfav, 1);
    if (LOC.active && gone && LOC.active.name === gone.name) LOC.active = null;
    saveLoc(); render(); locSheet();
  });
  $("#townAdd").onclick = () => {
    const v = $("#townIn").value.trim();
    const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
    const hit = (TOWNS || []).find(x => norm(x[0] + ", " + x[1]) === norm(v));
    if (!hit) return locSheet(v ? L(`"${v}" isn't in the town list. Pick one from the suggestions (town, state).`,
                                    `"${v}" não está na lista de cidades. Escolha uma das sugestões (cidade, UF).`)
                                : L("Type a town first.", "Digite uma cidade primeiro."));
    const name = hit[0] + ", " + hit[1];
    if (!LOC.favs.some(f => f.name === name)) LOC.favs.push({name, geo: [hit[2], hit[3]]});
    LOC.active = LOC.favs.find(f => f.name === name);
    saveLoc(); render(); locSheet(L(`Added ${name}.`, `Cidade adicionada: ${name}.`));
  };
}

// ---------- prices tab: market analysis per model ----------
const qtl = (v, p) => {
  const s = v.filter(x => x != null && !Number.isNaN(x)).sort((a, b) => a - b);
  if (!s.length) return null;
  const i = (s.length - 1) * p, lo = Math.floor(i), hi = Math.min(lo + 1, s.length - 1);
  return s[lo] + (s[hi] - s[lo]) * (i - lo);
};
const medv = v => qtl(v, .5);
const pctTxt = (x, digits = 0) => (Math.round(Math.abs(x) * 10 ** (digits + 2)) === 0 ? "" : x > 0 ? "+" : "−") + dec(Math.abs(x * 100), digits) + "%";
const pctAbs = x => dec(Math.abs(x * 100), 0) + "%";    // "6%" when the words say the direction
const kmTick = v => v >= 1000 ? dec(v / 1000, 0) + L("k", " mil") : String(v);
const fmtShort = iso => fmtDate(iso, false);
function niceDomain(lo, hi, n = 4) {            // round ends and ticks for an axis
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  const step = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(Math.round(v * 1e6) / 1e6);
  return [a, b, t];
}
const YEAR_RAMP = ["#1c5cab", "#2a78d6", "#5598e7", "#86b6ef", "#b7d3f6"];   // older -> newer (lighter on the dark surface)
const yearColor = (y, lo, hi) => hi <= lo ? YEAR_RAMP[2] : YEAR_RAMP[Math.round((y - lo) / (hi - lo) * (YEAR_RAMP.length - 1))];
const VIZ = {blue: "#3987e5", red: "#e66767", grid: "#29313c", fair: "#8d97a5"};
const mkOf = name => {
  const n = DATA.names.find(x => x.name === name);
  return n ? n.family + (AUTO ? "|auto" : "") : null;
};
const sinceTxt = () => DATA.baseline ? fmtDate(DATA.baseline) : "";
const siteDays = cars => cars.filter(c => c.days_src === "site" && c.days != null).map(c => c.days);   // real listing dates only
const fence = v => {                             // axis range that ignores a few extreme values
  const a = qtl(v, .25), b = qtl(v, .75), r = (b - a) || Math.abs(b) * .1 || 1;
  return [Math.max(qtl(v, 0), a - 2.5 * r), Math.min(qtl(v, 1), b + 2.5 * r)];
};
const thin = (ts, max = 4) => ts.length <= max ? ts : ts.filter((_, i) => i % Math.ceil(ts.length / max) === 0);
let ANA = {};                                    // tap targets of the charts on screen

function anaSection(title, sub, body) {
  return `<section class="ana"><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}${body}</section>`;
}
function carRow(c, extra) {
  return `<li><button type="button" data-car="${esc(c.id)}"><span>${esc([c.year, c.trim].filter(Boolean).join(" "))}, ${kmFmt(c.km)}</span>
    <b>${money(c.price)}</b><span class="m wide">${esc(c.place || "")}${c.place && extra ? ": " : ""}${extra}</span></button></li>`;
}
function dealTxt(vs) {
  return vs == null ? "" : vs > .02 ? `${Math.round(vs * 100)}% ${L("under fair", "abaixo do justo")}`
       : vs < -.02 ? `${Math.round(-vs * 100)}% ${L("over fair", "acima do justo")}` : L("about fair", "preço justo");
}

// KPI tiles
function locCard(here, total, what) {             // what the location filter is doing, and a wider radius when it's thin
  const next = RADII.find(r => r > (LOC.radius || 0));
  const thinTxt = here < 5 && next ? `<button class="linkbtn" type="button" data-radius="${next}">${L(`Widen to ${next} km`, `Ampliar para ${next} km`)}</button>` : "";
  return `<section class="ana loc-card"><h2>${L("Near", "Perto de")} ${esc(LOC.active.name)}</h2>
    <p class="sub">${LOC.radius ? L(`Within ${LOC.radius} km`, `Até ${LOC.radius} km`) : L("That town only", "Só a cidade")}: ${nf(here)} ${L("of", "de")} ${nf(total)} ${what}.
      ${here < 5 ? L(" Few ads here: the charts show the rest of Brazil in grey for comparison.", " Poucos anúncios aqui: os gráficos mostram o resto do Brasil em cinza para comparar.") : ""}</p>
    ${LOCAL ? `<p><b>${L("Prices here", "Preços aqui")}: ${levelTxt(LOCAL.lv)}</b> (${basisTxt()}, ${L("same model, km and year", "mesmo modelo, km e ano")}).
      ${L("Fair prices, % and scores below use the local level.", "Preço justo, % e notas abaixo usam o nível local.")}</p>` : ""}${thinTxt}</section>`;
}
function kpis(cars, nat) {                       // nat: every car of the model in Brazil, when cars are the local ones
  const prices = cars.map(c => c.price), kms = cars.map(c => c.km), days = siteDays(cars);
  const weekAgo = new Date(Date.now() - 7 * DAY).toISOString().slice(0, 10);
  const fresh = cars.filter(c => c.first_seen > (DATA.baseline || "") && c.first_seen >= weekAgo).length;
  const tracked7 = DATA.baseline && DATA.baseline <= weekAgo;
  const old60 = days.length ? days.filter(v => v > 60).length / days.length : null;
  const tile = (label, value, note) => `<div class="kpi"><small>${label}</small><b>${value}</b><span>${note}</span></div>`;
  const br = L("Brazil", "Brasil");
  if (nat) {
    const nd = siteDays(nat);
    return `<div class="kpis">
      ${tile(L("On sale here", "À venda aqui"), nf(cars.length), `${br}: ${nf(nat.length)}`)}
      ${tile(L("Median price", "Preço mediano"), cars.length ? money(medv(prices)) : "–", `${br}: ${money(medv(nat.map(c => c.price)))}`)}
      ${tile(L("Median km", "Km mediano"), cars.length ? kmFmt(Math.round(medv(kms) ?? 0)) : "–", `${br}: ${kmFmt(Math.round(medv(nat.map(c => c.km)) ?? 0))}`)}
      ${tile(L("Median time listed", "Tempo anunciado (mediana)"), days.length ? `${Math.round(medv(days))} ${L("days", "dias")}` : "–",
             nd.length ? `${br}: ${Math.round(medv(nd))} ${L("days", "dias")}` : "")}
    </div>`;
  }
  return `<div class="kpis">
    ${tile(L("On sale", "À venda"), nf(cars.length), tracked7 ? L(`${fresh} new in 7 days`, `${fresh} ${fresh === 1 ? "novo" : "novos"} em 7 dias`) : L(`tracked since ${sinceTxt()}`, `acompanhando desde ${sinceTxt()}`))}
    ${tile(L("Median price", "Preço mediano"), money(medv(prices)), `${L("middle half", "metade central")}: ${kShort(qtl(prices, .25))} – ${kShort(qtl(prices, .75))}`)}
    ${tile(L("Median km", "Km mediano"), kmFmt(Math.round(medv(kms) ?? 0)), `${L("middle half", "metade central")}: ${kmTick(Math.round(qtl(kms, .25) ?? 0))} – ${kmFmt(Math.round(qtl(kms, .75) ?? 0))}`)}
    ${tile(L("Median time listed", "Tempo anunciado (mediana)"), days.length ? `${Math.round(medv(days))} ${L("days", "dias")}` : "–",
           old60 != null ? L(`${Math.round(old60 * 100)}% over 60 days`, `${Math.round(old60 * 100)}% há mais de 60 dias`)
                         : L("no listing dates on these sites", "os sites não mostram a data"))}
  </div>`;
}
// Price against km, coloured by year, with the fair-price line for the typical year
function scatter(cars, mk, here) {               // here: the local cars (coloured); the rest of Brazil in grey behind them
  const pts = cars.filter(c => c.km != null && c.price);
  if (pts.length < 4) return "";
  const W = 340, H = 236, PL = 54, PR = 10, PT = 10, PB = 26;
  const [x0, x1, tx] = niceDomain(0, fence(pts.map(c => c.km))[1], 4);
  const [y0, y1, ty] = niceDomain(...fence(pts.map(c => c.price)), 4);
  const X = v => PL + (v - x0) / (x1 - x0) * (W - PL - PR), Y = v => PT + (y1 - v) / (y1 - y0) * (H - PT - PB);
  const years = pts.map(c => c.year).filter(Boolean), ylo = Math.min(...years), yhi = Math.max(...years);
  const inside = c => c.km >= x0 && c.km <= x1 && c.price >= y0 && c.price <= y1;
  const hereIds = here ? new Set(here.map(c => c.id)) : null;
  const front = pts.filter(c => inside(c) && (!hereIds || hereIds.has(c.id))).sort((a, b) => (a.year || 0) - (b.year || 0));
  const back = hereIds ? pts.filter(c => inside(c) && !hereIds.has(c.id)) : [];
  const r = front.length > 500 ? 3 : here ? 5 : 4;
  ANA.scatter = [...back, ...front].map(c => ({id: c.id, x: X(c.km), y: Y(c.price), front: !hereIds || hereIds.has(c.id)}));
  const m = DATA.market?.[mk]?.model, yr = Math.round(medv(years));
  const convShare = pts.filter(c => c.body === "conv").length / pts.length;
  const lv = here && LOCAL ? LOCAL.lv : 0;
  let fair = "", band = "";
  const byDeal = (state.scatCol || "deal") === "deal";
  if (m) {
    const f = km => Math.exp(m[0] + m[1] * km / 1e4 + m[2] * (yr - 2000) + (convShare > .5 ? DATA.b_conv || 0 : 0) + lv);
    const seg = [], up = [], dn = [], g = dealCuts().good, cy = p => Y(Math.max(y0, Math.min(y1, p))).toFixed(1);
    for (let i = 0; i <= 24; i++) {
      const k = x0 + (x1 - x0) * i / 24, p = f(k);
      if (p >= y0 && p <= y1) seg.push(`${X(k).toFixed(1)},${Y(p).toFixed(1)}`);
      up.push(`${X(k).toFixed(1)},${cy(p * (1 + g))}`); dn.unshift(`${X(k).toFixed(1)},${cy(p * (1 - g))}`);
    }
    if (seg.length > 1) fair = `<polyline points="${seg.join(" ")}" fill="none" stroke="${VIZ.fair}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    band = `<polygon points="${up.concat(dn).join(" ")}" fill="${VIZ.fair}" opacity=".16"/>`;
  }
  const grid = ty.map(v => `<line x1="${PL}" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="${VIZ.grid}"/><text x="${PL - 6}" y="${Y(v) + 4}" text-anchor="end">${kShort(v)}</text>`).join("")
    + tx.map(v => `<text x="${X(v)}" y="${H - 8}" text-anchor="middle">${kmTick(v)}</text>`).join("");
  const bg = back.map(c => `<circle cx="${X(c.km).toFixed(1)}" cy="${Y(c.price).toFixed(1)}" r="${back.length > 500 ? 2.5 : 3}" fill="#3a4350"/>`).join("");
  const dotCol = c => byDeal ? DEAL_COL[dealOf(vsOf(c))] || VIZ.fair : yearColor(c.year, ylo, yhi);
  const dots = front.map(c => `<circle cx="${X(c.km).toFixed(1)}" cy="${Y(c.price).toFixed(1)}" r="${r}" fill="${dotCol(c)}" stroke="var(--surface)" stroke-width="${r > 3 ? 2 : 1}"/>`).join("");
  const hidden = (here || pts).filter(c => !inside(c)).length;
  const ys = []; for (let y = ylo; y <= yhi; y++) ys.push(y);
  const present = DEAL_ORDER.filter(k => front.some(c => dealOf(vsOf(c)) === k));
  const legend = `<div class="minisw" role="group" aria-label="${L("Dot colour", "Cor dos pontos")}"><span>${L("Colour:", "Cor:")}</span>
      <button type="button" data-scatcol="deal" aria-pressed="${byDeal}">${L("price label", "preço")}</button><button type="button" data-scatcol="year" aria-pressed="${!byDeal}">${L("year", "ano")}</button></div>
    <div class="legend">${byDeal ? present.map(k => `<i style="background:${DEAL_COL[k]}"></i>${L(...DEAL_SHORT[k])}`).join(" ")
      : `${here ? L("Here, by year", "Aqui, por ano") : L("Year", "Ano")}: ${(ys.length > 6 ? [ylo, Math.round((ylo + yhi) / 2), yhi] : ys).map(y => `<i style="background:${yearColor(y, ylo, yhi)}"></i>${y}`).join(" ")}`}
    ${here ? `<i style="background:#3a4350;margin-left:10px"></i>${L("rest of Brazil", "resto do Brasil")}` : ""}
    ${fair ? `<span class="ln"></span>${here && LOCAL ? L(`local fair price, ${yr}`, `preço justo local, ${yr}`) : L(`fair price for a ${yr}`, `preço justo de um ${yr}`)}<i class="bandkey"></i>${L("fair range", "faixa justa")}` : ""}</div>`;
  return `${legend}<svg class="viz" id="scat" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("Asking price against km", "Preço pedido por km")}">
    ${grid}${band}${bg}${dots}${fair}<circle id="scatSel" r="7" fill="none" stroke="var(--text)" stroke-width="2" visibility="hidden"/></svg>
    <div class="readout" id="scatOut">${L("Tap a dot to see that car.", "Toque num ponto para ver o carro.")}${hidden ? ` <span class="m">(${hidden} ${L("outside the scale", "fora da escala")})</span>` : ""}</div>`;
}
// What moves the price: km, year, convertible (from the fair-price fit)
function movers(cars, mk) {
  const m = DATA.market?.[mk]?.model;
  if (!m) return "";
  const p = medv(cars.map(c => c.price)), km = Math.exp(m[1]) - 1, yr = Math.exp(m[2]) - 1;
  const lines = [];
  lines.push(Math.abs(km) < .005
    ? L(`<b>Km barely moves the asking price</b>: under 0.5% per 10,000 km. Lower km at the same price is the better buy.`,
        `<b>A km quase não muda o preço pedido</b>: menos de 0,5% a cada 10 mil km. Km mais baixa pelo mesmo preço é o melhor negócio.`)
    : L(`<b>Each 10,000 km more: ${pctTxt(km, 1)}</b> (about ${money(Math.abs(km * p))})`,
        `<b>Cada 10 mil km a mais: ${pctTxt(km, 1)}</b> (cerca de ${money(Math.abs(km * p))})`));
  lines.push(L(`<b>Each year newer: ${pctTxt(yr, 1)}</b> (about ${money(Math.abs(yr * p))})`,
               `<b>Cada ano mais novo: ${pctTxt(yr, 1)}</b> (cerca de ${money(Math.abs(yr * p))})`));
  if (LOC.active && LOCAL)
    lines.push(L(`<b>Near ${esc(LOC.active.name)}:</b> ${levelTxt(LOCAL.lv)} for the same car`,
                 `<b>Perto de ${esc(LOC.active.name)}:</b> ${levelTxt(LOCAL.lv)} para o mesmo carro`));
  if (DATA.b_conv && cars.some(c => c.body === "conv") && cars.some(c => c.body !== "conv"))
    lines.push(L(`<b>Convertible: ${pctTxt(Math.exp(DATA.b_conv) - 1, 1)}</b> against a fixed roof`,
                 `<b>Conversível: ${pctTxt(Math.exp(DATA.b_conv) - 1, 1)}</b> em relação ao teto fixo`));
  return `<ul class="facts-list">${lines.map(l => `<li>${l}</li>`).join("")}</ul>`;
}

// Price by model year: middle half (bar) and median (dot)
function byYear(cars, here, mk) {                 // here: local cars; Brazil's median then shows as a grey tick
  const group = cs => { const g = {}; cs.forEach(c => { if (c.year) (g[c.year] = g[c.year] || []).push(c.price); }); return g; };
  const g = group(cars), h = here ? group(here) : null, main = h || g;
  const ys = Object.keys(g).map(Number).sort((a, b) => b - a);
  if (ys.length < 2) return "";
  const W = 340, RH = 28, PL = 84, PR = 100, PT = 4;
  const S = mk ? yearSteps(cars, mk) : null, stepTxt = {};
  if (S) S.steps.forEach(s => stepTxt[s.y] = [s.step, S.best.includes(s) ? "best" : S.jumps.includes(s) ? "jump" : ""]);
  const all = ys.flatMap(y => [qtl(g[y], .25), qtl(g[y], .75), ...(h && h[y] ? [qtl(h[y], .25), qtl(h[y], .75)] : [])]);
  const [x0, x1, tx0] = niceDomain(Math.min(...all), Math.max(...all), 3);
  const tx = thin(tx0, 3);
  const X = v => PL + (v - x0) / (x1 - x0) * (W - PL - PR);
  const H = PT + ys.length * RH + 20;
  const rows = ys.map((y, i) => {
    const v = main[y] || [], cy = PT + i * RH + RH / 2;

    const st = stepTxt[y], stepEl = st ? `<rect x="38" y="${cy - 9}" width="40" height="18" rx="6" fill="${st[1] === "best" ? "rgba(47,156,102,.35)" : st[1] === "jump" ? "rgba(201,138,69,.3)" : "rgba(105,113,125,.25)"}"/>
      <text x="58" y="${cy + 4}" text-anchor="middle" style="fill:var(--text);font-size:11px">${pctTxt(st[0])}</text>` : "";
    if (!v.length) return `<text x="0" y="${cy + 4}" class="vl">${y}</text>${stepEl}${tick}<text x="${W}" y="${cy + 4}" text-anchor="end">${L("none here", "nenhum aqui")}</text>`;
    const a = qtl(v, .25), b = qtl(v, .75), m = medv(v);
    return `<text x="0" y="${cy + 4}" class="vl">${y}</text>${stepEl}
      ${v.length >= 3 ? `<rect x="${X(a).toFixed(1)}" y="${cy - 3}" width="${Math.max(6, X(b) - X(a)).toFixed(1)}" height="6" rx="3" fill="#1c5cab"/>` : ""}
      ${tick}<circle cx="${X(m).toFixed(1)}" cy="${cy}" r="5" fill="#b7d3f6" stroke="var(--surface)" stroke-width="2"/>
      <text x="${W}" y="${cy + 4}" text-anchor="end"><tspan class="vl">${kShort(m)}</tspan> (${v.length})</text>`;

  return `${h ? `<div class="legend"><i style="background:#b7d3f6"></i>${L("median here", "mediana aqui")}<span class="ln" style="width:2px;height:12px"></span>${L("median in Brazil", "mediana no Brasil")}</div>` : ""}
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("Price by model year", "Preço por ano-modelo")}">${axis}${rows}</svg>
    ${S && S.steps.length ? `<p class="fine">${L("Tag: how much more than the year before, for the same km and version. Green: best value; amber: a big jump.",
                                                  "Etiqueta: quanto custa a mais que o ano anterior, com a mesma km e versão. Verde: melhor custo-benefício; laranja: um salto grande.")}</p>` : ""}`;
}
// Time on the market: ads by days listed, and what old ads ask against new ones
function timeListed(cars, nat) {
  const B = [[0, 15, "0–15"], [16, 30, "16–30"], [31, 60, "31–60"], [61, 90, "61–90"], [91, 180, "91–180"], [181, 1e9, "180+"]];
  const withDays = cars.filter(c => c.days_src === "site" && c.days != null);
  if (withDays.length < 5) return `<p class="none">${L("Too few ads show their listing date.", "Poucos anúncios mostram a data de publicação.")}</p>`;
  const n = B.map(([a, b]) => withDays.filter(c => c.days >= a && c.days <= b).length), max = Math.max(...n, 1);
  const W = 340, H = 150, PT = 18, PB = 22, slot = W / B.length, bw = 24;
  const cols = B.map(([, , lab], i) => {
    const h = n[i] / max * (H - PT - PB), x = i * slot + (slot - bw) / 2, y = H - PB - h;
    return `${n[i] ? `<path d="M${x},${H - PB} V${y + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${H - PB} Z" fill="${VIZ.blue}"/>` : ""}
      <text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" class="vl">${n[i]}</text>
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  }).join("");
  const fresh = withDays.filter(c => c.days <= 30 && c.vs_fair != null).map(c => -c.vs_fair);
  const stale = withDays.filter(c => c.days > 60 && c.vs_fair != null).map(c => -c.vs_fair);
  let note = "";
  if (fresh.length >= 5 && stale.length >= 5) {
    const f = medv(fresh), s = medv(stale), rel = v => Math.abs(v) < .005 ? L("about the fair price", "perto do preço justo")
      : `${pctAbs(v)} ${v > 0 ? L("over fair", "acima do justo") : L("under fair", "abaixo do justo")}`;
    note = `<p>${L(`Ads listed over 60 days ask ${rel(s)}; ads up to 30 days old, ${rel(f)}.`,
                   `Anúncios com mais de 60 dias pedem ${rel(s)}; os de até 30 dias, ${rel(f)}.`)}
      ${s - f > .02 ? L(" Older ads usually have more room to negotiate.", " Os mais antigos costumam ter mais margem para negociar.") : ""}</p>`;
  }
  const without = cars.length - withDays.length;
  if (nat) {
    const nd = siteDays(nat);
    if (nd.length) note += `<p>${L(`Median here: ${Math.round(medv(withDays.map(c => c.days)))} days; Brazil: ${Math.round(medv(nd))} days.`,
                                    `Mediana aqui: ${Math.round(medv(withDays.map(c => c.days)))} dias; Brasil: ${Math.round(medv(nd))} dias.`)}</p>`;
  }
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("Ads by days listed", "Anúncios por dias à venda")}">
    <line x1="0" x2="${W}" y1="${H - PB}" y2="${H - PB}" stroke="${VIZ.grid}"/>${cols}</svg>${note}
    ${without ? `<p class="fine">${L(`${without} ads have no listing date on their site and are left out.`,
                                    `${without} anúncios não têm data de publicação no site e ficam de fora.`)}</p>` : ""}`;
}

// Price changes since tracking began
function priceCuts(cars) {
  const ch = cars.filter(c => c.hist && c.hist.length > 1);
  const cut = ch.filter(c => c.hist.some(([, p], i) => i && p < c.hist[i - 1][1]));
  if (!ch.length) return `<p class="none">${L(`No price changes since ${sinceTxt()}, when tracking began. They show here as sellers change prices.`,
                                              `Nenhuma mudança de preço desde ${sinceTxt()}, quando o acompanhamento começou. Elas aparecem aqui conforme os vendedores mudam os preços.`)}</p>`;
  const total = cut.map(c => c.price / c.hist[0][1] - 1);
  const recent = ch.map(c => ({c, d: c.hist[c.hist.length - 1][0], from: c.hist[c.hist.length - 2][1]}))
    .sort((a, b) => b.d.localeCompare(a.d)).slice(0, 6);
  return `<p>${L(`<b>${cut.length} of ${cars.length} ads (${Math.round(cut.length / cars.length * 100)}%)</b> cut their price since ${sinceTxt()}`,
                 `<b>${cut.length} de ${cars.length} anúncios (${Math.round(cut.length / cars.length * 100)}%)</b> baixaram o preço desde ${sinceTxt()}`)}${total.length
      ? L(`, by a median ${pctTxt(medv(total), 1)}.`, `, em mediana ${pctTxt(medv(total), 1)}.`) : "."}</p>
    <h3>${L("Latest changes", "Últimas mudanças")}</h3>
    <ul class="rows">${recent.map(({c, d, from}) => carRow(c, `${money(from)} → ${money(c.price)} (${pctTxt(c.price / from - 1, 1)}), ${fmtShort(d)}`)).join("")}</ul>`;
}

// Weekly market: price level against today's fair price, and ads on sale (two charts, one scale each)
function trend(mk) {
  const w = (DATA.market?.[mk]?.weeks || []).filter(x => x[2] != null);
  const newN = w.reduce((a, x) => a + x[3], 0), goneN = w.reduce((a, x) => a + x[4], 0);
  const flow = L(`${newN} new ${newN === 1 ? "ad" : "ads"}, ${goneN} left`,
                 `${newN} ${newN === 1 ? "anúncio novo" : "anúncios novos"}, ${goneN} ${goneN === 1 ? "saiu" : "saíram"}`);
  if (w.length < 3) return `<p class="none">${L(`The weekly charts appear after 3 weeks of data. Since ${sinceTxt()}: ${flow}.`,
                                                `Os gráficos semanais aparecem com 3 semanas de dados. Desde ${sinceTxt()}: ${flow}.`)}</p>`;
  const W = 340, H = 130, PL = 40, PR = 44, PT = 14, PB = 22;
  const lv = w.map(x => x[2] / w[0][2] - 1);
  const [y0, y1, ty] = niceDomain(Math.min(...lv, 0), Math.max(...lv, 0), 3);
  const X = i => PL + i / (w.length - 1) * (W - PL - PR), Y = v => PT + (y1 - v) / (y1 - y0) * (H - PT - PB);
  const line = lv.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const last = lv.length - 1;
  const lineSvg = `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("Price level by week", "Nível de preço por semana")}">
    ${ty.map(v => `<line x1="${PL}" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="${VIZ.grid}"/><text x="${PL - 6}" y="${Y(v) + 4}" text-anchor="end">${pctTxt(v)}</text>`).join("")}
    <polyline points="${line}" fill="none" stroke="${VIZ.blue}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last)}" cy="${Y(lv[last])}" r="4" fill="${VIZ.blue}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${X(last) + 8}" y="${Y(lv[last]) + 4}" class="vl">${pctTxt(lv[last], 1)}</text>
    <text x="${PL}" y="${H - 5}">${fmtShort(w[0][0])}</text><text x="${W - PR}" y="${H - 5}" text-anchor="end">${fmtShort(w[last][0])}</text></svg>`;
  const n = w.map(x => x[1]), nmax = Math.max(...n, 1), slot = (W - PL - PR) / w.length, bw = Math.min(24, slot - 2);
  const cols = `<svg class="viz" viewBox="0 0 ${W} 96" role="img" aria-label="${L("Ads on sale by week", "Anúncios à venda por semana")}">
    <line x1="${PL}" x2="${W - PR}" y1="74" y2="74" stroke="${VIZ.grid}"/>
    ${n.map((v, i) => { const h = v / nmax * 58, x = PL + i * slot + (slot - bw) / 2;
      return `<path d="M${x},74 V${74 - h + 3} q0,-3 3,-3 h${bw - 6} q3,0 3,3 V74 Z" fill="${VIZ.blue}"/>`; }).join("")}
    <text x="${PL + slot / 2}" y="90" text-anchor="middle">${n[0]}</text><text x="${PL + (w.length - .5) * slot}" y="90" text-anchor="middle" class="vl">${n[last]}</text></svg>`;
  return `<h3>${L("Asking prices against today's fair price, change since the first week", "Preço pedido em relação ao justo de hoje, variação desde a 1ª semana")}</h3>${lineSvg}
    <h3>${L("Ads on sale each week", "Anúncios à venda por semana")}</h3>${cols}
    <p class="fine">${L(`Since ${sinceTxt()}: ${flow}.`, `Desde ${sinceTxt()}: ${flow}.`)}</p>`;
}

// Ads that left (often sold)
function leftMarket(cars, mk) {
  const g = DATA.market?.[mk]?.gone;
  if (!g || !g.n) return `<p class="none">${L(`None has left yet since ${sinceTxt()}.`, `Nenhum saiu ainda desde ${sinceTxt()}.`)}</p>`;
  const act = medv(cars.filter(c => c.vs_fair != null).map(c => -c.vs_fair));
  const rel = v => v == null ? "" : Math.abs(v) < .005 ? L("about the fair price", "perto do preço justo")
    : `${pctAbs(v)} ${v > 0 ? L("over fair", "acima do justo") : L("under fair", "abaixo do justo")}`;
  return `<p>${L(`<b>${g.n} left</b> in the last 90 days`, `<b>${g.n} ${g.n === 1 ? "saiu" : "saíram"}</b> nos últimos 90 dias`)}${g.days != null

}

// Price level by state for this model (Brazil): diverging bars around the national fair price
const locUf = () => LOC.active ? LOC.active.name.split(",").pop().trim().toUpperCase() : null;   // state of the selected town
const REGION_NAME = {N: ["the North", "Norte"], NE: ["the Northeast", "Nordeste"], CO: ["the Centre-West", "Centro-Oeste"],
                     SE: ["the Southeast", "Sudeste"], S: ["the South", "Sul"]};
function divBars(rows, label, mark) {            // rows: [name, value (fraction) or null, n]; mark: a row name to point out
  if (!rows.length) return "";
  const W = 340, RH = 26, PL = 78, PR = 48, H = rows.length * RH + 6;
  const lim = Math.max(.05, ...rows.filter(r => r[1] != null).map(r => Math.abs(r[1])));
  const mid = PL + (W - PL - PR) / 2, half = (W - PL - PR) / 2;
  const bars = rows.map(([nm, v, n], i) => {
    const cy = 3 + i * RH + RH / 2, w = v == null ? 0 : Math.abs(v) / lim * half, x = v < 0 ? mid - w : mid;
    return `${nm === mark ? `<rect x="-6" y="${cy - RH / 2 + 1}" width="${W + 12}" height="${RH - 2}" rx="6" fill="var(--raised)"/>` : ""}<text x="0" y="${cy + 4}" class="vl">${esc(nm)}${nm === mark ? " ◂" : ""}</text><text x="${PL - 8}" y="${cy + 4}" text-anchor="end">${nf(n)}</text>
      ${w >= 1 ? `<rect x="${x.toFixed(1)}" y="${cy - 6}" width="${w.toFixed(1)}" height="12" rx="3" fill="${v < 0 ? VIZ.blue : VIZ.red}"/>` : ""}
      <text x="${W}" y="${cy + 4}" text-anchor="end" class="vl">${v == null ? "–" : pctTxt(v)}</text>`;
  }).join("");
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}"><line x1="${mid}" x2="${mid}" y1="0" y2="${H}" stroke="${VIZ.fair}"/>${bars}</svg>
    <div class="legend"><i style="background:${VIZ.blue};border-radius:2px"></i>${L("cheaper than the national level", "mais barato que a média do Brasil")}
      <i style="background:${VIZ.red};border-radius:2px;margin-left:8px"></i>${L("more expensive", "mais caro")}</div>`;
}
function byState(cars, name) {
  if (!DATA.areas) return "";
  const g = {};
  cars.forEach(c => { const uf = (c.place || "").split(",").pop().trim(); if (uf && c.vs_fair != null) (g[uf] = g[uf] || []).push(-c.vs_fair); });   // price / fair - 1
  const rows = Object.entries(g).filter(([, v]) => v.length >= 5).map(([uf, v]) => [uf, medv(v), v.length]).sort((a, b) => b[2] - a[2]).slice(0, 10);
  const uf0 = locUf();
  let note = "";
  if (uf0 && !rows.some(r => r[0] === uf0)) {    // the selected town's state is always shown, even with few ads
    const v = g[uf0] || [];
    rows.push([uf0, v.length ? medv(v) : null, v.length]);
    const lvAll = DATA.areas.uf[uf0];
    note = v.length >= 5 ? "" : v.length
      ? L(`${uf0}: only ${v.length} ${v.length === 1 ? "ad" : "ads"} of this model, so its figure is rough.`,
          `${uf0}: só ${v.length} ${v.length === 1 ? "anúncio" : "anúncios"} deste modelo, então o valor é aproximado.`)
      : L(`No ${esc(name)} on sale in ${uf0} right now.`, `Nenhum ${esc(name)} à venda em ${uf0} agora.`);
    if (v.length < 5 && lvAll) note += L(` Across all models, ${uf0} prices are ${levelTxt(lvAll[0])}.`,
                                          ` Considerando todos os modelos, os preços em ${uf0} estão ${levelTxt(lvAll[0])}.`);
  }
  if (rows.length < 2 && !uf0) return "";
  return anaSection(L("By state", "Por estado"), L("Median asking price against the national fair price, same year and km. States with 5+ ads; the number is how many.",
      "Preço pedido mediano em relação ao preço justo do Brasil, mesmo ano e km. Estados com 5+ anúncios; o número é quantos.")
      + (uf0 ? L(` ◂ marks ${uf0}, the selected town's state.`, ` ◂ marca ${uf0}, o estado da cidade escolhida.`) : ""),
    divBars(rows, L("Price by state", "Preço por estado"), uf0) + (note ? `<p>${note}</p>` : ""));
}

function bestDeals(cars, name) {                  // uses the local score and % while a town is selected
  const top = cars.filter(c => vsOf(c) != null).sort((a, b) => (scoreOf(b) ?? 0) - (scoreOf(a) ?? 0) || vsOf(b) - vsOf(a)).slice(0, 3);
  if (!top.length) return "";

    LOCAL ? L("Highest scores with the local fair price.", "Maiores notas com o preço justo local.") : L("Highest scores, national fair price.", "Maiores notas, preço justo do Brasil."),
    `<ul class="rows">${top.map(c => carRow(c, `${L("score", "nota")} ${scoreTxt(scoreOf(c))}, ${dealTxt(vsOf(c))}`)).join("")}</ul>
     <button class="linkbtn" type="button" data-golist="${esc(name)}">${L("See all in the list, best deals first", "Ver todos na lista, melhores negócios primeiro")}</button>`);
}
// "All": one row per model, and the price level by state for every model together
function overview(near) {                         // near: cars within the selected town's radius
  const rows = DATA.names.map(n => {
    const nat = DATA.cars.filter(c => c.name === n.name), cs = near ? near.filter(c => c.name === n.name) : nat;

      ${near ? `<td class="m">${nf(nat.length)}</td>` : ""}

      ${near ? "" : `<th>${L("Cut price", "Baixaram")}</th>`}</tr></thead><tbody>${rows}</tbody></table>
     <p class="fine">${near ? L("Median asking price and days listed of the ads here (days: ads with a site date only).",

       : `${L("Median asking price and median days listed (ads with a site date only). Cut price: share of ads that lowered their price since",
              "Preço pedido mediano e dias anunciado (mediana, só anúncios com data no site). Baixaram: parte dos anúncios que reduziram o preço desde")} ${sinceTxt()}.`}</p>`);
  const A = DATA.areas;
  if (A) {

    const st = Object.entries(A.uf).filter(([uf, [, n]]) => n >= 10 || uf === uf0).map(([uf, [lv, n]]) => [uf, Math.exp(lv) - 1, n]).sort((a, b) => a[1] - b[1]);
    const few = uf0 && A.uf[uf0] && A.uf[uf0][1] < 10 ? (r => `<p>${L(`${uf0}: only ${A.uf[uf0][1]} ads, so its level leans on the average of ${r[0]}.`,
        `${uf0}: só ${A.uf[uf0][1]} anúncios, então o nível também usa a média do ${r[1]}.`)}</p>`)(REGION_NAME[(A.region_of || {})[uf0]] || ["its region", "região"]) : "";
    html += anaSection(L("Price level by state", "Nível de preço por estado"),
      L("All models, manual and automatic, against the national fair price for the same model, km and year. Dashed: under 10 ads.",
        "Todos os modelos, manuais e automáticos, em relação ao preço justo do Brasil para o mesmo modelo, km e ano. Tracejado: menos de 10 anúncios.")
        + (uf0 ? L(` ◂ marks ${uf0}, the selected town's state.`, ` ◂ marca ${uf0}, o estado da cidade escolhida.`) : ""),
      tileMap(A, uf0) + few);
  }
  return html;
}
// ---------- phase 2 charts ----------
// Where the good prices are: years x km bands, coloured by the median asking price against fair
function yearKmGrid(cars) {
  const cs = cars.filter(c => c.year && c.km && vsOf(c) != null);
  if (cs.length < 12) return "";
  const kms = cs.map(c => c.km), st = 10000;
  const cuts = [...new Set([qtl(kms, .25), qtl(kms, .5), qtl(kms, .75)].map(v => Math.round(v / st) * st))].filter(v => v > 0).sort((a, b) => a - b);
  const bands = [0, ...cuts, Infinity].slice(0, -1).map((a, i, arr) => [a, i + 1 < arr.length ? arr[i + 1] : Infinity]);
  const bandOf = km => bands.findIndex(([a, b]) => km >= a && km < b);
  const lab = ([a, b]) => b === Infinity ? `${kmTick(a)}+` : a === 0 ? `<${kmTick(b)}` : `${kmTick(a).replace(/ mil$|k$/, "")}–${kmTick(b)}`;
  const yc = {};
  cs.forEach(c => yc[c.year] = (yc[c.year] || 0) + 1);
  const ys = Object.keys(yc).map(Number).filter(y => yc[y] >= 3).sort((a, b) => b - a);
  if (ys.length < 2) return "";
  ANA.grid = {};
  cs.forEach(c => { const k = c.year + "|" + bandOf(c.km); (ANA.grid[k] = ANA.grid[k] || []).push(c); });
  const shade = v => v <= -.05 ? ["rgba(57,135,229,.55)", "#d6e8fd"] : v <= -.02 ? ["rgba(57,135,229,.25)", "#b7d3f6"]
    : v < .02 ? ["rgba(105,113,125,.28)", "var(--text)"] : v < .05 ? ["rgba(230,103,103,.25)", "#f5c0bb"] : ["rgba(230,103,103,.5)", "#ffe0dc"];
  const head = `<span></span>${bands.map(b => `<span class="gh">${lab(b)}</span>`).join("")}`;
  const rows = ys.map(y => `<span class="gy">${y}</span>${bands.map((_, i) => {

      : L(`; a ${r.more.y} fits with over ${kmR(r.more.km)}`, `; um ${r.more.y} cabe com mais de ${kmR(r.more.km)}`);

    } else {

        const g = inB.filter(c => c.name === n.name && ["great", "good"].includes(dealOf(vsOf(c)))).length;

        if (!ok.length) return `<li>${dot}${L("from", "a partir de")} ${kShort(Math.min(...fit.map(r => r.from)))}</li>`;
        return `<li>${dot}${L("up to", "até")} <b>${ok[0].best.y}</b>${ok[0].v ? " " + esc(ok[0].v) : ""}${g ? L(`; ${g} good or great ${g === 1 ? "price" : "prices"}`, `; ${g} com preço bom ou ótimo`) : ""}</li>`;
      }).join("");

        <ul class="rows">${top.map(c => carRow(c, `${name ? "" : esc(c.name) + ", "}${dealName(dealOf(vsOf(c)))}, ${L("score", "nota")} ${scoreTxt(scoreOf(c))}`)).join("")}</ul>
        <button class="linkbtn" type="button" data-budlist="${esc(name || "")}">${L(`See all ${nf(inB.length)} up to ${kShort(B)} in the list`, `Ver os ${nf(inB.length)} até ${kShort(B)} na lista`)}</button>`
      : `<p>${L("No ads at or under this amount right now.", "Nenhum anúncio até esse valor agora.")}</p>`;
    body += `<p class="fine">${L(`Fair prices at each year's typical km${LOCAL ? ` near ${esc(LOC.active.name)}` : ""}. Leave room for taxes, registration and the first maintenance.`,
                                 `Preços justos com a km típica de cada ano${LOCAL ? ` perto de ${esc(LOC.active.name)}` : ""}. Reserve dinheiro para transferência, documentação e as primeiras manutenções.`)}</p>`;
  }

}

function cleanUrl(u) {                           // the same ad shared twice gives the same address: no tracking, no anchor
  try {

    if (!/^https?:$/.test(x.protocol)) return null;
    const fb = x.pathname.match(/\/marketplace\/item\/(\d+)/);
    if (fb) return "https://www.facebook.com/marketplace/item/" + fb[1];

  } catch (e) { return null; }
}
function allNames() {                            // every model this store tracks, manual or automatic
  const seen = new Map();
  for (const d of [MAN_DATA, AUTO_DATA, DATA]) for (const n of [...(d?.names || []), ...(d?.names_all || [])]) if (!seen.has(n.name)) seen.set(n.name, n);
  return [...seen.values()];
