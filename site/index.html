function bodiesOf(name) {                        // bodies seen for a model, most common first; else the ones it came in
  const cnt = {};
  for (const d of [MAN_DATA, AUTO_DATA]) for (const c of (d?.cars || [])) if (c.name === name && c.body) cnt[c.body] = (cnt[c.body] || 0) + 1;
  const seen = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);

function loadTowns() {

function findTown(raw, ufHint) {                 // "Campinas - SP" / "Campinas, SP" in the ad text, or the town in a site's own state
  if (!TOWNS || !raw) return null;
  const w = " " + plain(raw).replace(/[^a-z0-9]+/g, " ") + " ";
  let best = null;
  for (const t of TOWNS) {
    const tn = plain(t[0]).replace(/[^a-z0-9]+/g, " ").trim();
    if (tn.length < 4 || !w.includes(" " + tn + " ")) continue;
    const s = (w.includes(" " + tn + " " + t[1].toLowerCase() + " ") ? 2 : 0) + (ufHint && t[1] === ufHint ? 1 : 0) + tn.length / 100;
    if (s >= 1 && (!best || s > best.s)) best = {t, s};
  }
  return best ? {name: best.t[0] + ", " + best.t[1], geo: [best.t[2], best.t[3]]} : null;
}
function parseAd(title, text, url) {             // what an ad's link and text say: site, model, year, km, price, version, gearbox
  const raw = [title, text, url].filter(Boolean).join(" ");
  const link = (String(url || "").match(/https?:\/\/[^\s"'<>]+/i) || raw.match(/https?:\/\/[^\s"'<>]+/i) || [])[0] || "";
  let host = "", path = "";
  try { const u = new URL(link); host = u.hostname.replace(/^(www|m)\./, ""); path = decodeURIComponent(u.pathname); } catch (e) {}
  const site = (SITE_OF.find(([rx]) => rx.test(host)) || [null, host])[1];
  const country = /\.br$/.test(host) ? "BR" : /\.ca$/.test(host) ? "CA" : null;
  const prose = raw.replace(/https?:\/\/\S+/g, " ");
  const words = plain(prose + " " + path.replace(/[\/_.-]+/g, " "));
  const ys = allNames().flatMap(n => n.years || []), y0 = Math.min(...ys) - 1, y1 = Math.max(...ys) + 1;
  let year = null;
  const pair = plain(prose + " " + path).match(/\b((?:19|20)\d\d) ?[\/-] ?((?:19|20)\d\d)\b/);         // "2014/2015": model year
  if (pair && +pair[2] - +pair[1] >= 0 && +pair[2] - +pair[1] <= 1) year = +pair[2];
  else year = [...words.matchAll(/\b(19[89]\d|20[0-3]\d)\b/g)].map(m => +m[1]).find(v => v >= y0 && v <= y1) || null;
  const br = (country || COUNTRY) === "BR";
  const pm = prose.match(br ? /R\$\s?(\d{1,3}(?:\.\d{3})+|\d{4,})(?:,\d{2})?/i : /\$\s?(\d{1,3}(?:,\d{3})+|\d{4,})(?:\.\d{2})?/);
  const price = pm ? +pm[1].replace(/[.,]/g, "") : null;
  const kmM = words.match(/\b(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?) ?(mil|k)? ?(km|kms|quilometros)\b/);
  let km = kmM ? (kmM[2] ? parseFloat(kmM[1].replace(",", ".")) * 1000 : +kmM[1].replace(/[.,]/g, "")) : null;
  if (!(km > 0 && km < 1e6)) km = null;
  const names = allNames(), fit = n => !year || (year >= n.years[0] && year <= n.years[1]);
  const fam = (MODEL_RX.find(([f, rx]) => rx.test(words) && names.some(n => n.family === f && fit(n))) || [])[0];
  const body = /\b(conversivel|cabrio|cabriolet|convertible|roadster)\b/.test(words) ? "conv" : /\b(sedan|seda|4p|4 portas)\b/.test(words) ? "sedan"
    : /\b(coupe|cupe|2p|2 portas)\b/.test(words) ? "coupe" : /\b(wagon|touring|perua)\b/.test(words) ? "wagon" : "";
  const cands = names.filter(n => n.family === fam && fit(n));
  const name = (cands.find(n => body && bodiesOf(n.name)[0] === body) || cands[0] || {}).name || "";
  const gear = /\b(aut|automatico|automatica|automatic|cvt)\b/.test(words) ? "a" : /\b(manual|mec|mecanico)\b/.test(words) ? "m" : (AUTO ? "a" : "m");
  const mk = fam ? fam + (gear === "a" ? "|auto" : "") : "";
  const version = Object.keys((DATA.score.versions || {})[mk] || {}).sort((a, b) => b.length - a.length)
    .find(v => new RegExp("(^|[^a-z0-9])" + plain(v).replace(/[^a-z0-9]+/g, " ") + "([^a-z0-9]|$)").test(words)) || "";
  const ufHint = (host.match(/^([a-z]{2})\.olx\.com\.br$/) || [])[1]?.toUpperCase() || "";
  const kj = path.match(/^\/v-[^/]+\/([a-z-]+)-([a-z]{2})\//);                  // Kijiji: /v-cars-trucks/kingston-on/...
  const town = kj ? {name: kj[1].split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ") + ", " + kj[2].toUpperCase(), geo: null} : null;

          town, ufHint, raw: prose};
}

const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch (e) { return d; } };

let SHARED_VER = 0, SHARED_CACHE = {key: "", cars: []}, INSTALL = null;
function adToCar(a, origin) {
  const n = allNames().find(x => x.name === a.name) || allNames().find(x => x.family === a.family);
  const year = +a.year || null, price = +a.price || null;
  if (!n || !year || !price) return null;
  const trans = a.gear === "a" ? "a" : "m";
  const first = String(a.added || new Date().toISOString()).slice(0, 10), last = String(a.updated || a.added || first).slice(0, 10);
  const c = {id: a.id || "sh-eval", name: n.name, family: n.family, year, km: +a.km || null, price, trim: a.version || "", trans,
    body: a.body || bodiesOf(n.name)[0] || "coupe", place: a.city ? a.city + (a.uf ? ", " + a.uf : "") : a.uf || "",
    geo: a.lat !== "" && a.lat != null && a.lon !== "" && a.lon != null && isFinite(+a.lat) ? [+a.lat, +a.lon] : null,
    url: a.url || "", source: a.site || "", photos: [], red: [], green: [], flags_read: false, note: a.title || "", desc: "",
    first_seen: first, last_seen: last, verified: last, days: Math.max(0, Math.round((Date.now() - asDate(first)) / DAY)), days_src: "tracked",
    shared: origin === "group", mine: origin === "mine"};
  if (!c.km) { const tk = typicalKm(n.name, year); c.km = tk ? Math.round(tk / 1000) * 1000 : null; c.km_guess = true; }
  const mk = mkOfCar(c), m = DATA.market?.[mk]?.model;
  if (m && c.km != null) {                       // the collector's maths: national fair price, % under it, confidence, score
    c.fair = Math.round(fairAt(mk, year, c.km, verOf(c), c.body === "conv") / 100) * 100;
    c.vs_fair = 1 - price / c.fair;
    c.conf = Math.round(m[3] / (m[3] + 5) * 100) / 100;
    c.sr = DATA.score.base + pricePart(c.vs_fair) / DATA.score.pct_per_point * c.conf;
    c.score = Math.round(Math.max(0, Math.min(10, c.sr)) * 10) / 10;
  } else c.fair = c.vs_fair = c.conf = c.sr = c.score = null;
  const S = DATA.fipe?.series;
  if (S) for (const k of [`${n.family}|${verOf(c) || ""}|${trans}|${year}`, `${n.family}||${trans}|${year}`].map(k => k + (c.body === "conv" ? "|conv" : ""))) {
    if (S[k]) { const h = S[k].hist; c.fipe = h[h.length - 1][1]; c.fipe_k = k; break; }
  }

}
function sharedCars() {                          // saved and group ads for the current gearbox; the group copy wins
  if (!DATA) return [];
  const key = COUNTRY + "|" + SHARED_VER + "|" + (AUTO ? "a" : "m");
  if (SHARED_CACHE.key !== key) {
    const by = new Map(), cut = Date.now() - 60 * DAY;
    for (const a of mineAds()) { const c = adToCar(a, "mine"); if (c) by.set(c.id, c); }
    for (const a of feedAds()) {
      if (a.country !== COUNTRY || a.status === "gone" || new Date(a.updated || a.added) < cut) continue;
      const c = adToCar(a, "group");
      if (c) { c.mine = by.has(c.id); by.set(c.id, c); }
    }
    SHARED_CACHE = {key, cars: [...by.values()]};
  }
  return SHARED_CACHE.cars.filter(c => AUTO ? c.trans === "a" : c.trans !== "a");
}

  }
  if (!INCOMING.share) return;
  const s = INCOMING.share, a = parseAd(s.title, s.text, s.url);
  if (a.country && a.country !== COUNTRY) return switchCountry();     // the store of that site; boot() comes back here
  INCOMING.share = null;
  const hit = listedCar(a.url);
  if (hit) return detailSheet(hit);
  const id = a.url ? hashId(cleanUrl(a.url) || a.url) : "", saved = id && (mineAds().find(x => x.id === id) || feedAds().find(x => x.id === id));
  evalSheet(saved ? {...saved, town: saved.city ? {name: saved.city + (saved.uf ? ", " + saved.uf : ""), geo: saved.lat !== "" && saved.lat != null ? [+saved.lat, +saved.lon] : null} : null}
                  : {...a, id});
}
window.addEventListener("beforeinstallprompt", e => { INSTALL = e; });          // Chrome's own install banner still shows
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- events ----------
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-budget]");
  if (!f) return;
  e.preventDefault();
  state.budget = parseBudget(f.querySelector("input").value);
  f.querySelector("input").blur();
  save(); render();
});
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-close]") || t.id === "scrim") return closeSheet();
  const info = t.closest("[data-info]");
  if (info) { e.stopPropagation(); return detailSheet(carById(info.dataset.info)); }
  const gmb = t.closest("[data-gm]");
  if (gmb) return setAuto(gmb.dataset.gm === "a");
  if (t.closest("#scat")) return scatTap(e);
  const cellB = t.closest("[data-cell]");
  if (cellB) return gridTap(cellB.dataset.cell);
  const tile = t.closest("[data-tile]");
  if (tile) return tileTap(tile.dataset.tile);
  const sc = t.closest("[data-scatcol]");
  if (sc) { state.scatCol = sc.dataset.scatcol; return render(); }
  const fb = t.closest("[data-fbin]");
  if (fb) return fipeTap(+fb.dataset.fbin);
  const bud = t.closest("[data-bud]");
  if (bud) { state.budget = +bud.dataset.bud; save(); return render(); }
  const budList = t.closest("[data-budlist]");
  if (budList) {
    Object.assign(state, {tab: "list", names: budList.dataset.budlist ? [budList.dataset.budlist] : [], maxPrice: state.budget, sort: "score", dir: "desc"});
    window.scrollTo({top: 0}); return render();
  }
  const chk = t.closest("[data-checklist]");
  if (chk) return checklistSheet(chk.dataset.checklist);
  const carB = t.closest("[data-car]");
  if (carB) return detailSheet(DATA.cars.find(c => c.id === carB.dataset.car));
  const anaRow = t.closest("[data-ana]");
  if (anaRow) { state.ana = anaRow.dataset.ana; window.scrollTo({top: 0}); return render(); }
  const widen = t.closest(".ana [data-radius]");
  if (widen) { LOC.radius = +widen.dataset.radius; saveLoc(); return render(); }
  const goList = t.closest("[data-golist]");
  if (goList) {
    Object.assign(state, {tab: "list", names: [goList.dataset.golist], sort: "score", dir: "desc"});
    window.scrollTo({top: 0}); return render();
  }
  const chip = t.closest(".chip");
  if (chip && state.tab === "prices") { state.ana = chip.dataset.name; window.scrollTo({top: 0}); return render(); }
  if (chip) {
    const n = chip.dataset.name;
    state.names = !n ? [] : state.names.includes(n) ? state.names.filter(x => x !== n) : [...state.names, n];
    return render();
  }
  if (t.id === "clearAll") { Object.assign(state, DEFAULT_STATE); return render(); }
  if (t.closest("#othersBtn")) return linksSheet();
  if (t.closest("#evalBtn")) return evalSheet();
  if (t.closest("#extBtn")) { state.ext = !state.ext; window.scrollTo({top: 0}); return render(); }
  if (t.closest("#locEdit") || t.closest("#locEdit2") || t.closest("#locPin")) return locSheet();
  const lb = t.closest("[data-loc]");
  if (lb) {
    const name = lb.dataset.loc;
    const f = LOC.favs.find(x => x.name === name);
    LOC.active = !name || (LOC.active && LOC.active.name === name && f) ? null : (f || LOC.active);
    if (!LOC.active && state.sort === "near") state.sort = "score";
    saveLoc(); window.scrollTo({top: 0}); return render();
  }
  const cardEl = t.closest(".card");
  if (cardEl) { const c = carById(cardEl.dataset.id); if (c && c.url) window.open(c.url, "_blank", "noopener"); else if (c) detailSheet(c); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#layer").hidden) closeSheet();
  if (e.key === "Enter" && e.target.classList?.contains("card")) e.target.click();
});
document.addEventListener("error", e => {          // photo fallback: second address, then "No photo"
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("pic")) return;
  if (img.dataset.alt) { const a = img.dataset.alt; img.dataset.alt = ""; img.src = a; return; }
  img.remove(); const ph = document.querySelector(`[data-id="${CSS.escape(img.closest?.(".card")?.dataset.id || "")}"] .nophoto`);
  if (ph) ph.hidden = false;
}, true);
$("#sortScore").onclick = () => { if (state.sort !== "score") { state.sort = "score"; state.dir = "desc"; } render(); };
$("#sortPrice").onclick = () => { if (state.sort !== "price") { state.sort = "price"; state.dir = "asc"; } render(); };
$("#dirBtn").onclick = () => { state.dir = state.dir === "asc" ? "desc" : "asc"; render(); };
$("#filtersBtn").onclick = () => filterSheet();
$("#menuBtn").onclick = () => menuSheet();
$("#flagBtn").onclick = () => confirmCountry();
$("#tabList").onclick = () => { if (state.tab !== "list") { state.tab = "list"; window.scrollTo({top: 0}); render(); } };
$("#tabPrices").onclick = () => {
  if (state.tab === "prices") return;
  state.tab = "prices";
  const one = effNames();
  if (one.length === 1) state.ana = one[0];      // coming from the list with one model picked: open that model
  window.scrollTo({top: 0}); render();
};

function boot() {
  const want = COUNTRY;
  DATA = MAN_DATA = AUTO_DATA = null;
  AUTO = false;
  document.querySelector(".top").classList.remove("auto-on");
  $("#meta").textContent = L("Loading…", "Carregando…");
  $("#chips").innerHTML = "";
  $("#list").innerHTML = "";
  fetch(CUR().file + "?" + Date.now(), {cache: "no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status === 404 ? "not built yet" : r.status); return r.json(); })
    .then(d => {
      if (want !== COUNTRY) return;                  // switched again while loading
      DATA = MAN_DATA = d;
      state.names = state.names.filter(n => d.names.some(x => x.name === n));
      $("#meta").textContent = `${nf(d.cars.length)} ${L("cars", "carros")}, ${ago(d.updated)}`;
      SHARED_VER++;
      render();
      handleIncoming();
      loadFeed();
    })
    .catch(err => {
      if (want !== COUNTRY) return;
      $("#meta").textContent = "";
      $("#list").innerHTML = err.message === "not built yet"
        ? `<div class="empty">${L(`The ${esc(CUR().name)} list appears after the next daily update. Tap the flag to go back.`,
                                   "A lista do Brasil aparece depois da próxima atualização diária. Toque na bandeira para voltar.")}</div>`
        : `<div class="empty">${L(`The car list could not be loaded (${esc(err.message)}). Check your connection and pull down to refresh.`,
                                  `Não foi possível carregar a lista de carros (${esc(err.message)}). Confira sua conexão e puxe para baixo para recarregar.`)}</div>`;
    });
}
paintFlag();
boot();
</script>
</body>
</html>
